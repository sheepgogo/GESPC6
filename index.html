"哈夫曼树与哈夫曼编码": `
<h3>一、WPL：带权路径长度</h3>
<p>结点的<b>路径长度</b>是从根到它的边数；<b>带权路径长度 WPL（Weighted Path Length）</b> = Σ(每个叶子的权值 × 路径长度)。同样一组权值可以造出很多二叉树，<b>WPL 最小的那棵叫哈夫曼树（最优二叉树）</b>。例如权值 1、2、3：若全部挂在一棵满树深度 2 上，WPL = (1+2+3)×2 = 12；若让 3 当根、1 和 2 挂深一层，WPL = 1×2 + 2×2 + 3×1 = 9 更小，后者就是哈夫曼树。</p>
<h3>二、哈夫曼树的构造（贪心）</h3>
<p>真题必考步骤：<b>每次从森林中取出权值最小的两棵树合并成一棵新树，新树权值为两者之和，放回森林，重复直到只剩一棵</b>。可用优先队列（最小堆）高效实现：每次取两个最小、合并、插回。</p>
<ul>
<li>n 个叶子的哈夫曼树共有 <b>2n - 1</b> 个结点（每次合并增加 1 个结点，共合并 n-1 次）；</li>
<li>哈夫曼树中<b>没有度为 1 的结点</b>（每次合并都是两个孩子），又称严格二叉树或正则二叉树；</li>
<li>权值越大的结点离根越近、权值越小的结点离根越远——这就是"最优"的含义：高频字符编码短、节省总位数；</li>
<li>若多个权值相等，并列时选谁会影响左右分支但 WPL 不变。</li>
</ul>
<h3>三、哈夫曼编码</h3>
<p>给哈夫曼树的左分支记 0、右分支记 1（或反之），从根到叶子的路径串就是该字符的<b>哈夫曼编码</b>。核心性质：</p>
<ul>
<li><b>前缀码（prefix code）：</b>任何一个字符的编码都不是另一个字符编码的前缀，因此解码时可以无歧义地切分——这是哈夫曼编码能用来压缩的根本原因；</li>
<li><b>无损压缩：</b>原文可完整还原，<b>不是有损压缩</b>（真题判断"哈夫曼编码是一种有损压缩算法"是<b>错误</b>的）；</li>
<li>频率（概率）越高的字符编码越短，总编码长度 = WPL，所以在给定频率下总长最短；</li>
<li>解码反着走：从根出发，遇 0 走左、遇 1 走右，到达叶子输出字符再回到根。</li>
</ul>
<h3>四、计算示例</h3>
<p>字符 A B C D E F G 出现概率 0.40、0.30、0.15、0.05、0.04、0.03、0.03。若按哈夫曼规则构造且 B 的编码为 11，则 C 常为 10、A 常为 0 开头的一批中最短……真题即此模型：先按概率构造出哈夫曼树，再顺着 0/1 分支写出各字符编码。做题时务必自己画树，注意"合并时取最小的两个"。</p>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 判断）：</b>"哈夫曼编码是一种有损压缩算法。"<br>解析：错误。哈夫曼编码是<b>无损压缩</b>，原文可完整还原。</p>
<p><b>真题 2（2309 单选）：</b>"有 4 个权值 1、2、3、4，构造哈夫曼树后该树共有几个结点？"<br>解析：n 个叶子的哈夫曼树共有 2n - 1 个结点。这里 n = 4，所以结点总数 = 2×4 - 1 = 7。</p>
<p><b>真题 3（2409 单选）：</b>"下列关于哈夫曼编码的说法正确的是？"<br>A. 是有损压缩　B. 是前缀码　C. 编码后长度固定　D. 不能用于文本压缩<br>解析：答案是 B。哈夫曼编码是无损压缩（不是有损）、是前缀码（任何编码不是另一编码前缀）、编码后长度可变（高频短、低频长）、可用于文本压缩。排除 A、C、D。</p>
<p><b>真题 4（2412 判断）：</b>"哈夫曼树中一定存在度为 1 的结点。"<br>解析：错误。哈夫曼树没有度为 1 的结点（每次合并都是两个孩子）。</p>
<p><b>真题 5（2509 单选）：</b>"字符频率 0.4、0.3、0.15、0.1、0.05 构造哈夫曼树，频率 0.4 字符的编码长度是？"<br>解析：贪心合并过程（0.05+0.1=0.15，与原 0.15 合并=0.3，再与原 0.3 合并=0.6，最后与 0.4 合并=1.0）。0.4 在最后一层，深度 1，编码长度 1 位。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>哈夫曼编码是<b>无损</b>压缩；</li>
<li>n 个叶子的哈夫曼树共 2n - 1 个结点、无度为 1 的结点；</li>
<li>哈夫曼编码是前缀码，"存在某编码是另一编码的前缀"必错；</li>
<li>给定 B=11 求其他编码，必须按哈夫曼构造规则画树，不能瞎猜；</li>
<li>WPL = Σ(权 × 路径长)，路径长按"边数"计；</li>
<li>不同字符编码必须不同（叶子结点编码不可能重复）；</li>
<li>哈夫曼树不唯一（权值相等时不同合并顺序产生不同形态，但 WPL 相同）。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 哈夫曼编码是<b>无损</b>压缩；(2) n 个叶子的哈夫曼树共 2n-1 个结点、无度为 1 的结点；(3) 哈夫曼编码是前缀码，"存在某编码是另一编码的前缀"必错；(4) 给定 B=11 求其他编码，必须按哈夫曼构造规则画树，不能瞎猜；(5) WPL = Σ(权×路径长)，注意路径长按"边数"计；(6) 高频字符编码短、低频字符编码长。</div>
`,

"格雷码": `
<h3>一、什么是格雷码</h3>
<p><b>格雷码（Gray Code）</b>是一种特殊的二进制编码：任意两个<b>相邻</b>的代码之间<b>只有一位二进制数不同</b>。例如 3 位格雷码序列：000、001、011、010、110、111、101、100——每走一步只翻转一位。这一性质避免了多位同时翻转可能带来的瞬态错误，因此格雷码被称为<b>可靠性编码</b>，常用于角度编码器、磁盘定位、电梯按钮相邻层编码等硬件场景。</p>
<h3>二、格雷码的性质（真题考点）</h3>
<ul>
<li><b>相邻性：</b>相邻两个代码恰好一位不同，这正是它的定义；</li>
<li><b>循环（反射）特性：</b>首尾两个代码（最大数和最小数）也只有一位不同，整个序列首尾相接仍然"相邻"——真题考过"最大数和最小数只有一位二进制数不同"，说法正确；</li>
<li><b>可靠性编码：</b>逐位变化避免了多位同时翻转可能带来的瞬态错误，所以格雷码在硬件定位场景使用广泛；</li>
<li><b>不是唯一性编码：</b>满足相邻性质的编码方案不止一种（反射格雷码只是其中最常用的一种），"格雷码是一种唯一性编码"是真题选项中的<b>错误</b>说法；</li>
<li>n 位格雷码共有 <b>2ⁿ 个编码</b>。</li>
</ul>
<h3>三、二进制与格雷码的转换</h3>
<p>二进制转格雷码：<b>最高位不变，其余每一位 g[i] = b[i] 异或 b[i+1]</b>（原二进制的相邻两位异或）；格雷码转二进制：最高位不变，其余 b[i] = g[i] 异或 b[i-1]（逐步异或还原）。简洁的实现：</p>
<pre>// 二进制 b 转 格雷码 g
g = b ^ (b &gt;&gt; 1);        // 二进制数整体与右移一位后异或
// 例：b = 1011（十进制 11）
// 右移一位得 0101，逐位异或：1110，即 11 的格雷码是 1110

// 格雷码 g 转 二进制 b
for (b = g; (g &gt;&gt;= 1) != 0; ) b ^= g;  // 逐步异或还原</pre>
<h3>四、典型真题精讲</h3>
<p><b>真题 1（2309 单选）：</b>"关于格雷码，下列说法正确的是？"<br>A. 相邻两个代码只有一位不同　B. 是一种有损压缩　C. 是无重复的二进制编码　D. 以上都不对<br>解析：答案是 A。B 错（格雷码不是压缩方案）；C 错（"无重复"含义模糊，格雷码强调相邻一位不同，不一定"无重复字符"）；D 错。</p>
<p><b>真题 2（2309 判断）：</b>"格雷码中最大数和最小数也只有一位二进制数不同。"<br>解析：正确。循环格雷码首尾相接，相邻一位不同。</p>
<p><b>真题 3（2409 单选）：</b>"二进制数 1011 对应的格雷码是？"<br>A. 1110　B. 1101　C. 0011　D. 1111<br>解析：g = 1011 ^ 0101 = 1110，答案是 A。</p>
<p><b>真题 4（2503 单选）：</b>"格雷码是？"<br>A. 唯一性编码　B. 可靠性编码　C. 有损压缩　D. 加密算法<br>解析：答案是 B。"唯一性编码"是错误说法（格雷码是一类编码），不是压缩也不是加密。</p>
<h3>五、易错点对比小结</h3>
<ul>
<li>格雷码相邻只有一位不同，首尾也只有一位不同；</li>
<li>格雷码是可靠性编码、不是唯一性编码、不是压缩方案；</li>
<li>转换口诀"最高位照抄，其余相邻异或"；</li>
<li>简洁实现 <code>g = b ^ (b >> 1)</code>，要明白右移是逻辑右移；</li>
<li>n 位格雷码有 2ⁿ 个编码。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) "相邻只有一位不同"对，"首尾也只有一位不同"也对；(2) "格雷码是唯一性编码"错——它是一类编码的统称；(3) 转换口诀"最高位照抄，其余相邻异或"；n 位格雷码仍然有 2ⁿ 个编码；(4) 格雷码常用于角度编码器、磁盘定位等硬件场景，是可靠性编码。</div>
`,

"深度优先搜索": `
<h3>一、DFS：一条道走到黑，撞墙再回头</h3>
<p><b>深度优先搜索（Depth-First Search，DFS）</b>：从起点出发，沿着一条路一直往深处走，走不动（无路可走或已访问过）就回退一步换条路，直到所有能到的地方都去过。真题判断"DFS 是深度优先算法的英文简写"为正确（Depth-First Search）。</p>
<h3>二、递归框架（树的遍历就是 DFS）</h3>
<pre>bool visited[N];                 // 标记是否访问过
void dfs(int u) {
    visited[u] = true;           // 到达 u，先标记
    // 在这里处理 u（相当于"访问"）
    for (u 的每个邻接点 v)
        if (!visited[v]) dfs(v); // 没去过就一头扎进去
}</pre>
<ul>
<li><b>树的先序、中序、后序遍历都是深度优先遍历</b>——沿着深度方向一头扎到底再回头；</li>
<li>递归调用天然自带"回头"机制（函数返回就是回退）；改用<b>显式栈</b>同样可实现 DFS：把起点入栈，出栈访问，再把未访问的邻居入栈；</li>
<li>图上 DFS 要配 visited 数组防止绕圈（环）；树没有环，可省去标记。</li>
</ul>
<h3>三、复杂度与"最差 O(n)"考法</h3>
<p>每个结点进出各一次、每条边最多看一两次：邻接表存图时 DFS 为 <b>O(n + e)</b>（n 结点、e 条边）；邻接矩阵为 O(n²)。真题判断"如果节点数为 n，广度/深度搜索算法的最差时间复杂度为 O(n)"——就树（或给定结构的图）按结点访问次数计，每个结点恰好访问一次，说法正确；如果用"边数"计则邻接表 O(n+e) 与"最差 O(n)"并不等价，要看具体语境。</p>
<h3>四、DFS 能干什么</h3>
<ul>
<li>遍历/搜索所有可达位置：走迷宫、数岛屿、连通块个数；</li>
<li>枚举所有方案：全排列、组合、子集（"选或不选"二叉决策树上的 DFS）；</li>
<li>树上统计：子树大小、树的深度等（递归返回信息）；</li>
<li>拓扑排序、强连通分量等图算法也基于 DFS。</li>
</ul>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 判断）：</b>"DFS 是深度优先算法的英文简写。"<br>解析：正确。DFS = Depth-First Search，"深度优先搜索"。</p>
<p><b>真题 2（2312 单选）：</b>"DFS 通常使用哪种数据结构？"<br>A. 队列　B. 栈　C. 数组　D. 链表<br>解析：答案是 B。DFS 用栈（递归栈或显式栈）实现，BFS 用队列实现，别记反。</p>
<p><b>真题 3（2403 单选）：</b>"图的邻接表存储下 DFS 的时间复杂度为？"<br>A. O(n)　B. O(n + e)　C. O(n²)　D. O(e²)<br>解析：答案是 B。每个结点和每条边各访问一次，O(n + e)。如果存的是邻接矩阵则是 O(n²)。</p>
<p><b>真题 4（2412 单选）：</b>"n 个结点的图 DFS 访问，最差时间复杂度为？"<br>A. O(1)　B. O(log n)　C. O(n)　D. O(n²)<br>解析：按"结点访问次数"计是 O(n)（每个结点恰好访问一次）；按"边访问次数"计还要看邻接表还是邻接矩阵。真题通常考"节点数为 n 时 BFS/DFS 最差时间复杂度为 O(n)"为正确，指的是按结点数计。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>DFS 用<b>栈</b>（递归栈或显式栈），BFS 用队列，别记反；</li>
<li>先/中/后序遍历都属于深度优先；</li>
<li>图上搜索必须判 visited，否则死循环（环）；</li>
<li>递归深度太大可能栈溢出（必要时改显式栈）；</li>
<li>复杂度按"结点数"计为 O(n)，按"边数+结点数"计为 O(n+e)。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) DFS 用<b>栈</b>（递归栈或显式栈），BFS 用队列，别记反；(2) 先/中/后序遍历都属于深度优先；(3) 图上搜索必须判 visited，否则死循环；(4) 递归深度太大可能栈溢出；(5) "DFS 最差时间复杂度 O(n)"按结点数计正确，按边数+结点数计则是 O(n+e)；(6) DFS 用于遍历/枚举/搜索，DFS 求无权图最短路不保证最短。</div>
`,

"宽度优先搜索": `
<h3>一、BFS：一圈一圈向外扩散</h3>
<p><b>宽度优先搜索（Breadth-First Search，BFS，又称广度优先搜索）</b>：先访问起点，再依次访问离起点距离为 1 的所有点，然后距离为 2 的……像水波纹一圈圈扩散。<b>队列</b>是实现 BFS 的标准工具：</p>
<pre>bool visited[N];
void bfs(int s) {
    queue&lt;int&gt; q;
    q.push(s);  visited[s] = true;     // 起点入队并标记
    while (!q.empty()) {
        int u = q.front(); q.pop();    // 队头出队
        // 在这里处理 u
        for (u 的每个邻接点 v)
            if (!visited[v]) { visited[v] = true; q.push(v); }
    }
}</pre>
<ul>
<li><b>二叉树的层序遍历就是 BFS：</b>根入队，出队访问，左右孩子入队，队列保证"同一层先处理完才轮到下一层"；</li>
<li><b>入队时立刻标记 visited</b>，不要等出队再标记，否则同一结点可能重复入队（真题考过这个细节逻辑）；</li>
<li>空间开销可能很大：同一时刻队列里可能装着"一整层"的结点。</li>
</ul>
<h3>二、BFS 的招牌应用：无权图最短路径</h3>
<p>在所有边长度相同（无权）的图或网格里，BFS 按"离起点越来越远"的顺序访问，<b>第一次到达某点时经过的步数就是最短步数</b>。迷宫最短路、传染扩散、最少操作次数（如"最少几步变到目标状态"）都靠它。注意：边权不同时（带权图）需要用 Dijkstra 而不是 BFS。</p>
<h3>三、复杂度与对比</h3>
<table>
<tr><th>对比项</th><th>DFS 深度优先</th><th>BFS 宽度优先</th></tr>
<tr><td>数据结构</td><td>栈（递归）</td><td>队列</td></tr>
<tr><td>访问顺序</td><td>一头扎到底再回头</td><td>按层次一圈圈扩散</td></tr>
<tr><td>找最短路</td><td>不保证（要遍历所有路径）</td><td>无权图保证最短</td></tr>
<tr><td>时间复杂度</td><td colspan="2">同为 O(n+e)（邻接表）/ O(n²)（邻接矩阵），每个结点都访问一次</td></tr>
<tr><td>空间复杂度</td><td>O(n) 栈深</td><td>O(n) 队列宽</td></tr>
</table>
<h3>四、典型真题精讲</h3>
<p><b>真题 1（2309 判断）：</b>"BFS 是广度优先搜索的英文简写。"<br>解析：正确。BFS = Breadth-First Search = 广度优先搜索 = 宽度优先搜索，三者是同一回事的不同译名。</p>
<p><b>真题 2（2312 单选）：</b>"在无权图中求单源最短路径应使用？"<br>A. DFS　B. BFS　C. Dijkstra　D. Floyd<br>解析：答案是 B。无权图 BFS 一次遍历即得最短路；带权图才用 Dijkstra；Floyd 是全源最短路。</p>
<p><b>真题 3（2406 单选）：</b>"二叉树的层序遍历对应？"<br>A. DFS　B. BFS　C. 先序遍历　D. 后序遍历<br>解析：答案是 B。层序遍历是按层从左到右访问，正是 BFS 的过程。</p>
<p><b>真题 4（2412 单选）：</b>"下列关于 BFS 实现的说法错误的是？"<br>A. 使用队列　B. 入队时立即标记 visited　C. 出队时再标记 visited　D. 先访问起点再访问邻居<br>解析：答案是 C。入队时就要标记 visited，不能等出队再标，否则同一结点会重复入队（如果先入队后标记、出队时再发现未标记就重复了）。</p>
<h3>五、易错点对比小结</h3>
<ul>
<li>BFS = Breadth-First Search，与宽度优先、广度优先是同一件事的不同译名；</li>
<li>层序遍历是宽度优先；</li>
<li>"节点数为 n 时最差时间复杂度 O(n)"的判断题为正确（按结点数计）；</li>
<li>求"最少步数/最短距离"用 BFS（无权图），求"所有路径/是否存在"用 DFS；</li>
<li>BFS 入队时立刻标记 visited，避免重复入队。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) BFS = Breadth-First Search，与宽度优先、广度优先是同一件事的不同译名；(2) 层序遍历是宽度优先；(3) "节点数为 n 时最差时间复杂度 O(n)"的判断题为正确（按结点数计）；(4) 求"最少步数/最短距离"用 BFS，求"所有路径/是否存在"用 DFS；(5) 入队时立刻标记 visited，不能等出队再标。</div>
`,

"简单动态规划": `
<h3>一、从递推到动态规划</h3>
<p>青蛙每次能跳 1 或 2 级台阶，跳到第 n 级的方案数 f(n)：最后一步要么从 n-1 跳来、要么从 n-2 跳来，所以 <b>f(n) = f(n-1) + f(n-2)</b>，正是斐波那契。真题问这段代码用的算法——答案<b>动态规划（递推求解）</b>，不是贪心、不是分治。<b>动态规划（DP）</b>适用于：大问题可以拆成重叠子问题，且具有"最优子结构"。做题四步：定义状态、写<b>状态转移方程</b>、确定边界（初始值）、确定计算顺序（小到大）。它把重复子问题只算一次存进数组，这是它与朴素递归（重复计算、超时）的本质区别。</p>
<h3>二、DP 与分治、贪心的区别</h3>
<table>
<tr><th>策略</th><th>子问题是否重叠</th><th>是否记录中间结果</th><th>是否保证全局最优</th></tr>
<tr><td>分治</td><td>不重叠</td><td>不需要</td><td>看合并方式</td></tr>
<tr><td>动态规划</td><td>重叠</td><td>需要（DP 表）</td><td>是</td></tr>
<tr><td>贪心</td><td>不重叠</td><td>不需要</td><td>不一定（看问题）</td></tr>
</table>
<h3>三、一维动态规划</h3>
<pre>// 青蛙跳台阶 / 爬楼梯：f[i] = f[i-1] + f[i-2]
int f[105];
f[1] = 1; f[2] = 2;
for (int i = 3; i &lt;= n; i++) f[i] = f[i-1] + f[i-2];

// 数字三角形最大路径和：从下往上，f[i][j] = a[i][j] + max(下、右下)</pre>
<p>真题编程题"小杨买饮料"（每种饮料至多买 1 瓶、总容量不低于 L 的最少花费）就是背包模型。</p>
<h3>四、简单背包（0/1 背包）</h3>
<p>n 件物品，第 i 件花费 c[i]、容量 l[i]，每件<b>至多选一次</b>，求总容量达到要求时的最小花费。设 cost[j] = 恰好（或至少）达到容量 j 的最少花费，转移：<b>cost[j] = min(cost[j], cost[j-l] + c)</b>，必须按 j 从大到小（倒序）更新，保证每件物品只用一次：</p>
<pre>cost[0] = 0;
for (int j = 1; j &lt;= L; j++) cost[j] = INF;      // 求最小值，初值设无穷大
for (int i = 0; i &lt; n; i++) {
    int c, l;  cin &gt;&gt; c &gt;&gt; l;
    for (int j = L; j &gt;= 0; j--)                 // 0/1 背包：倒序！
        cost[j] = min(cost[j], cost[max(j - l, 0)] + c);
}
// cost[L] 仍为 INF 则输出 no solution</pre>
<p><b>完全背包</b>（每件物品可以选无数次）则是<b>正序</b>更新 j（从 l 到 L）。注意区分。</p>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 单选）：</b>"青蛙跳台阶问题（每次跳 1 或 2 级）的解法属于？"<br>A. 贪心　B. 分治　C. 动态规划　D. 回溯<br>解析：答案是 C。f(n) = f(n-1) + f(n-2) 是典型的 DP（重叠子问题）。贪心每次选最大跳幅反而不对（不能保证最多方案）；分治子问题不重叠；回溯会枚举所有路径太慢。</p>
<p><b>真题 2（2403 单选）：</b>"0/1 背包的一维 DP 数组 j 循环应使用？"<br>A. 从小到大　B. 从大到小　C. 没有要求　D. 随机<br>解析：答案是 B。从大到小（倒序）保证每件物品只被选一次。</p>
<p><b>真题 3（2412 单选）：</b>"数字三角形最大路径和的算法属于？"<br>A. 分治　B. 贪心　C. 动态规划　D. 枚举<br>解析：答案是 C。子问题重叠（多个路径共用一些点）、最优子结构（局部最优→全局最优），是典型 DP。</p>
<p><b>真题 4（2509 编程题）：</b>"小杨买饮料"——n 种饮料（每种至多买 1 瓶）、每种价格 c、容量 l，求总容量 ≥ L 的最少花费。<br>解析：0/1 背包变形。cost[0..L]，cost[j] = INF 初始；遍历饮料，对 j 从 L 到 0 倒序：cost[j] = min(cost[j], cost[max(j-l, 0)] + c)。答案为 cost[L]。若仍为 INF 则无解。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>0/1 背包一维数组必须<b>倒序</b>更新，正序会让同一件物品被选多次（那是完全背包）；</li>
<li>求最小值把 DP 初值设为无穷大、求方案数设为 0 且 f[0]=1；</li>
<li>青蛙跳台阶类题是 DP 也是递推，但不是贪心；</li>
<li>先写对状态定义再写转移，判断题常拿"状态转移方程是否必要"做文章——DP 的核心就是状态与转移方程；</li>
<li>分治与 DP 的关键区别是子问题是否重叠。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 0/1 背包一维数组必须<b>倒序</b>更新，正序会让同一件物品被选多次（那是完全背包）；(2) 求最小值把 DP 初值设为无穷大、求方案数设为 0 且 f[0]=1；(3) 青蛙跳台阶类题是 DP 也是递推，但不是贪心；(4) 先写对状态定义再写转移，判断题常拿"状态转移方程是否必要"做文章——DP 的核心就是状态与转移方程；(5) DP 与分治：DP 子问题重叠，分治子问题不重叠。</div>
`,

"排序与分治": `
<h3>一、分治思想：分、治、合</h3>
<p><b>分治（Divide and Conquer）</b>：把大问题<b>分</b>成同类型的小问题，递归解<b>治</b>，再把结果<b>合</b>并。典型代表就是归并排序与快速排序。它与 DP 的区别：分治的子问题<b>不重叠</b>（各管一段），DP 的子问题重叠（要记表复用）。分治三步走：</p>
<ul>
<li><b>分：</b>把问题分成若干个同类型的子问题（通常一分为二）；</li>
<li><b>治：</b>递归解决子问题，直到子问题足够小直接解；</li>
<li><b>合：</b>把子问题的解合并成原问题的解。</li>
</ul>
<h3>二、归并排序（六级编程题常客）</h3>
<p>递归地把序列对半分成两段，各自排好序后<b>合并</b>：双指针比较两段头部，谁小谁先进入辅助数组。</p>
<pre>void mergeSort(int l, int r) {          // 排 [l, r)
    if (l + 1 == r) return;             // 只剩 1 个数，天然有序
    int m = (l + r) / 2;
    mergeSort(l, m);  mergeSort(m, r);  // 分：两半各自排好
    // 合：双指针归并到 tmp，再拷回
    for (int i = l, j = m, k = l; k &lt; r; k++) {
        if (j == r || (i &lt; m &amp;&amp; num[i] &gt; num[j])) tmp[k] = num[i++];  // 降序：先取大的
        else                                                         tmp[k] = num[j++];
    }
    for (int k = l; k &lt; r; k++) num[k] = tmp[k];
}</pre>
<ul>
<li>时间复杂度稳定 <b>O(n log n)</b>（无论数据是否有序），空间 O(n)（辅助数组）；<b>稳定排序</b>（相等元素相对顺序不变）；</li>
<li>快速排序平均 O(n log n)、最坏 O(n²)（已有序时），空间 O(log n)，不稳定。</li>
</ul>
<h3>三、归并求逆序对（真题编程题）</h3>
<p>"握手问题"本质是<b>逆序对</b>：每次进入的同学与教室里学号更小的同学握手，总共握手次数 = 输入序列中"前面的数比后面的数大"的点对数。暴力 O(n²) 会超时，用归并排序：合并两段时若<b>左段当前数大于右段当前数</b>，则左段剩余的所有数都与它构成逆序，<b>累加 m - i</b>（配合降序归并实现），总复杂度 O(n log n)。真题参考程序正是这个模板。</p>
<h3>四、稳定性小结</h3>
<table>
<tr><th>排序</th><th>平均</th><th>最坏</th><th>稳定</th><th>空间</th></tr>
<tr><td>冒泡</td><td>O(n²)</td><td>O(n²)</td><td>稳定</td><td>O(1)</td></tr>
<tr><td>插入</td><td>O(n²)</td><td>O(n²)</td><td>稳定</td><td>O(1)</td></tr>
<tr><td>选择</td><td>O(n²)</td><td>O(n²)</td><td>不稳定</td><td>O(1)</td></tr>
<tr><td>归并</td><td>O(n log n)</td><td>O(n log n)</td><td>稳定</td><td>O(n)</td></tr>
<tr><td>快速</td><td>O(n log n)</td><td>O(n²)</td><td>不稳定</td><td>O(log n)</td></tr>
</table>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 编程第 2 题）：</b>"小杨的握手问题"——n 个同学按顺序进入教室，每个进入的同学与教室里<b>学号更小</b>的同学握手，求总握手次数。<br>解析：握手次数 = 序列逆序对数。暴力枚举 O(n²) 超时，用归并排序求逆序对 O(n log n)：合并两段时若左段当前 &gt; 右段当前，左段剩余元素都与之构成逆序，累加 (m - i)。配合降序归并实现。</p>
<p><b>真题 2（2406 单选）：</b>"下列排序算法中最坏时间复杂度是 O(n²) 的是？"<br>A. 归并排序　B. 快速排序　C. 堆排序　D. 以上都不是<br>解析：答案是 B。归并最坏 O(n log n)，快速最坏 O(n²)（已有序时）。堆排序最坏 O(n log n)。</p>
<p><b>真题 3（2503 判断）：</b>"归并排序是稳定排序。"<br>解析：正确。归并排序是稳定排序（相等元素相对顺序不变）。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>归并排序最坏也是 O(n log n)，快排最坏 O(n²)；</li>
<li>归并稳定、快排不稳定；</li>
<li>"提示用归并排序求逆序对"暗示正解 O(n log n)；</li>
<li>归并需要 O(n) 额外空间；</li>
<li>分治与 DP：分治子问题不重叠、DP 子问题重叠。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 归并排序最坏也是 O(n log n)，快排最坏 O(n²)；(2) 归并稳定、快排不稳定；(3) "提示用归并排序求逆序对"暗示正解 O(n log n)；(4) 归并需要 O(n) 额外空间；(5) 分治与 DP 区别：分治子问题不重叠、DP 子问题重叠；(6) 求逆序对数时合并段若左&gt;右则左段剩余都构成逆序，累加 m-i。</div>

"代码阅读与程序分析": `
<h3>一、六级读程序题长什么样</h3>
<p>六级卷的读程序题大多围绕<b>类与对象</b>展开：给一段定义了类的代码，问输出、报错或行为。读题四步：</p>
<ul>
<li>第一步：看类定义——私有成员有哪些、构造函数做什么、哪些成员函数是 public 的；</li>
<li>第二步：跟踪对象创建——每个对象创建时执行哪个构造函数、成员被初始化成什么；</li>
<li>第三步：逐条执行 main——注意哪些语句访问了私有成员（编译错误）、哪些调用了不存在或未重载的运算符；</li>
<li>第四步：边界与析构——程序结束时析构顺序与构造顺序相反（后构造的先析构）。</li>
</ul>
<h3>二、常见"找错"题型套路</h3>
<ul>
<li><b>私有越界：</b>类外直接 cout &lt;&lt; obj.data（data 是 private）——编译错误，须走公有接口；</li>
<li><b>未重载 &lt;&lt;：</b>cout &lt;&lt; 自定义类对象，若没为该类重载 &lt;&lt; 运算符则编译错误；</li>
<li><b>构造函数：</b>MyStr st("ABC"); 会调用对应构造函数，不会报错（有匹配构造时）；带单参数的构造函数还支持隐式类型转换；</li>
<li><b>自定义结构实现队列/栈：</b>判断"该类能否用于构造 Queue/Stack"——看它是否提供了先进先出/后进先出的 push、pop 且边界安全（如 __data 满/空时是否有保护，没有则可能运行时错误）；</li>
<li><b>连续 push：</b>"连续调用 push() 导致编译错误"通常是错误说法——连续 push 编译没问题，出问题的是运行期越界；</li>
<li><b>命名空间同名冲突：</b>using namespace A 与 using namespace B 引入的同名函数——编译期二义性错误，不是运行错误。</li>
</ul>
<h3>三、读树与遍历代码</h3>
<p>另一类读程序题给递归遍历或建树代码。技巧：拿小样例<b>画调用栈</b>，每层递归写出"进入时、递归左、访问、递归右"三列，按序抄下 visit 的输出即可。遇到计数、求和类函数，先明确"返回值含义"再代入边界（空树返回 0 或 1 视题意）。</p>
<h3>四、编译错误 vs 运行错误</h3>
<table>
<tr><th>类型</th><th>常见原因</th><th>触发时机</th></tr>
<tr><td>编译错误</td><td>私有越界、未重载运算符、类型不匹配、命名冲突</td><td>编译阶段</td></tr>
<tr><td>运行错误</td><td>数组越界、空栈 pop、除以零、无限递归、指针未初始化</td><td>运行阶段</td></tr>
</table>
<p>这是六级读程序题最爱辨析的细节：选项常给"编译错误"或"运行错误"让你判断，必须看清楚原因在哪一阶段暴露。</p>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 单选）：</b>"下列哪种情况属于编译错误？"<br>A. cout &lt;&lt; obj.data，data 是 private　B. 空栈 pop　C. 数组下标越界　D. 指针未初始化就解引用<br>解析：答案是 A。编译阶段就能查出私有越界；B、C、D 都是运行期错误。</p>
<p><b>真题 2（2406 判断）：</b>"未重载 &lt;&lt; 的自定义类对象用 cout 输出是运行错误。"<br>解析：错误。是编译错误（类型不匹配），不是运行错误。</p>
<p><b>真题 3（2412 单选）：</b>"全局静态对象的析构顺序与构造顺序的关系是？"<br>A. 相同　B. 相反　C. 无关　D. 随机<br>解析：答案是 B。析构顺序与构造顺序相反——后构造的先析构。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>读程序选项里"编译错误"与"运行错误"要分清；</li>
<li>私有访问、未重载运算符、类型不匹配是<b>编译期</b>错误；</li>
<li>数组越界、空栈 pop、除以零是<b>运行期</b>错误；</li>
<li>析构顺序与构造顺序相反；</li>
<li>读递归遍历代码时画调用栈最有效。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>读程序选项里"编译错误"与"运行错误"要分清：私有访问、未重载运算符、类型不匹配是<b>编译期</b>错误；数组越界、空栈 pop、除以零是<b>运行期</b>错误。析构顺序与构造顺序相反也是常考细节。"未重载 &lt;&lt; 输出自定义类对象"是编译错误不是运行错误。</div>

"编程实践": `
<h3>一、六级编程题命题画像</h3>
<p>六级编程题每卷 2 道（各 25 分），高频主题：<b>动态规划</b>（背包变形如"小杨买饮料"、一维递推）、<b>归并排序求逆序对</b>（如"握手问题"）、<b>树与遍历</b>（建树、层序/中序输出）、<b>BFS 最短路</b>（网格迷宫）、字符串或模拟综合题。数据规模通常在 10⁵ 量级，暗示需要 O(n log n) 或 O(n) 算法——看到"提示：可以考虑使用归并排序"这类话，基本就是正解方向。</p>
<h3>二、答题流程建议</h3>
<ul>
<li><b>先读三样：</b>问题描述、输入输出格式、数据规模。数据规模决定算法复杂度上限：n ≤ 20 可搜索，n ≤ 5000 可 O(n²)，n ≤ 10⁵ 必须 O(n log n) 或更优；</li>
<li><b>拿样例过思路：</b>手动模拟样例，确认理解题意后再动笔，尤其注意"特别提醒：不要在输入输出中附带任何提示信息"（考场上多打一句提示就可能判错）；</li>
<li><b>边界优先想：</b>no solution、n=0、全相同、恰好等于边界值——把特殊样例在代码里显式处理；</li>
<li><b>整数范围：</b>题目结果可能超过 int（如逆序对最多约 n²/2 个，n=3×10⁵ 时约 4.5×10¹⁰），<b>必须用 long long</b>；</li>
<li><b>数组开够：</b>按数据规模的最大值开静态数组（如 num[300005]），别在栈里开大数组。</li>
</ul>
<h3>三、复杂度自查表</h3>
<table>
<tr><th>看到 n 的规模</th><th>可用算法量级</th><th>典型做法</th></tr>
<tr><td>n ≤ 20</td><td>O(2ⁿ)</td><td>枚举/DFS 全搜索</td></tr>
<tr><td>n ≤ 5000</td><td>O(n²)</td><td>双重循环、朴素 DP</td></tr>
<tr><td>n ≤ 10⁵ ~ 10⁶</td><td>O(n log n) / O(n)</td><td>归并、排序、一维 DP、BFS</td></tr>
</table>
<h3>四、C++ 编程细节注意</h3>
<ul>
<li><b>输入输出加速：</b>数据量大时用 <code>ios::sync_with_stdio(false); cin.tie(nullptr);</code>，并避免混用 scanf/printf 与 cin/cout；</li>
<li><b>数组边界：</b>静态数组大小至少开到数据规模 + 5；</li>
<li><b>字符串：</b>用 <code>getline</code> 读整行时注意吃掉上一行末尾的换行；</li>
<li><b>排序：</b>使用 <code>sort(a, a+n)</code>，自定义比较函数注意 <code>return a.x &lt; b.x;</code>；</li>
<li><b>栈溢出：</b>递归深度可能超过 10⁵ 时改显式栈；</li>
<li><b>文件读写：</b>不在本地交作业时一般不需要，主函数内用标准输入输出即可。</li>
</ul>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2309 编程 26）：</b>"小杨买饮料"——n 种饮料，每种价格 c、容量 l，每种至多买 1 瓶，求总容量 ≥ L 的最少花费。<br>解析：0/1 背包变形。一维 DP，cost[0..L]，cost[j] = INF 初始；遍历饮料，对 j 从 L 到 0 倒序：cost[j] = min(cost[j], cost[max(j-l, 0)] + c)。答案为 cost[L]，若仍 INF 则无解。</p>
<p><b>真题 2（2309 编程 27）：</b>"小杨的握手问题"——n 个同学按序进入教室，每个进入者与教室内学号更小的同学握手，求总握手次数。<br>解析：逆序对数。归并排序过程中若左段当前 &gt; 右段当前，左段剩余 (m-i) 个都与该右元素构成逆序，累加。降序归并实现，O(n log n)。</p>
<p><b>真题 3（2406 编程 27）：</b>"最长上升子序列"——n 个数，求最长上升子序列长度。<br>解析：经典一维 DP。dp[i] = 以 i 结尾的最长上升子序列长度；转移 dp[i] = max(dp[j]+1)，j &lt; i 且 a[j] &lt; a[i]。O(n²) 可过 n≤5000；n≤10⁵ 需优化到 O(n log n)（二分 + 贪心 tails 数组）。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>结果可能超 int 就用 long long；</li>
<li>"no solution" 等特殊输出要原样照抄（大小写、空格）；</li>
<li>0/1 背包倒序循环；</li>
<li>归并排序辅助数组也要开同样大；</li>
<li>考场程序不要输出任何提示语；</li>
<li>数据规模暗示算法复杂度——n ≤ 10⁵ 就要 O(n log n) 或更优。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 结果可能超 int 就用 long long；(2) "no solution" 等特殊输出要原样照抄（大小写、空格）；(3) 0/1 背包倒序循环；(4) 归并排序辅助数组也要开同样大；(5) 考场程序不要输出任何提示语；(6) n ≤ 10⁵ 就要 O(n log n) 或更优；(7) 递归太深改显式栈防栈溢出。</div>

(function(){
  var EXAM_ORDER = Object.keys(window.EXAM_DATA).sort();
  var main = document.getElementById('mainArea');

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 将题干中的代码行识别出来，包成 <pre class="code">
  var codeRe = /(#include|using namespace|int main|cout|cin|printf|scanf|return |[;{}]\s*$|^\s*(int|for|while|if|else|double|char|bool|const|long)\b|\+\+|--|&&|\|\||<<|>>)/;
  function formatStem(stem){
    var lines = String(stem).split('\n');
    var html = '', buf = [], mode = null;
    function flush(){
      if(!buf.length) return;
      if(mode === 'code'){ html += '<pre class="code">' + buf.map(esc).join('\n') + '</pre>'; }
      else { html += '<div class="stem">' + buf.map(esc).join('\n') + '</div>'; }
      buf = [];
    }
    for(var i=0;i<lines.length;i++){
      var ln = lines[i];
      var isCode = codeRe.test(ln) && !/[。？！：；，]/.test(ln);
      var m = isCode ? 'code' : 'text';
      if(mode === null) mode = m;
      if(m !== mode){ flush(); mode = m; }
      buf.push(ln);
    }
    flush();
    return html;
  }

  function sectionLabel(sec){ return sec; }

  // 考纲重点标注
  function kpTag(kp){
    if(typeof KP_FOCUS !== 'undefined' && KP_FOCUS.indexOf(kp) >= 0) return '<span class="focus-tag">考纲重点</span>';
    return '';
  }
  function kpDot(kp){
    if(typeof KP_FOCUS !== 'undefined' && KP_FOCUS.indexOf(kp) >= 0) return '<i class="focus-dot"></i>';
    return '';
  }
  function kpNote(kp){
    if(typeof KP_FOCUS !== 'undefined' && KP_FOCUS.indexOf(kp) >= 0) return '本知识点承载六级考纲重点内容，建议优先掌握。';
    return '';
  }

  function renderQuestion(q, showExamTag){
    var exam = window.EXAM_DATA[q.id.split('-')[0]];
    var h = '<div class="qcard" id="q-' + q.id + '">';
    h += '<div class="qmeta">';
    h += '<span class="qnum">' + sectionLabel(q.section) + ' 第 ' + q.number + ' 题</span>';
    if(showExamTag && exam){ h += '<span class="tag exam">' + esc(exam.title) + '</span>'; }
    h += '<span class="tag sec">' + esc(q.section) + '</span>';
    h += '</div>';
    h += '<div class="knw-lead" onclick="showKP(\'' + q.knowledge + '\')" title="查看该知识点讲解与同类题"><span class="knw-label">知识点</span>' + esc(q.knowledge) + kpTag(q.knowledge) + '</div>';
    h += formatStem(q.stem);

    if(q.options && q.options.length){
      h += '<div class="opts">';
      for(var i=0;i<q.options.length;i++){
        var letter = q.options[i].trim().charAt(0);
        h += '<div class="opt" data-q="' + q.id + '" data-letter="' + letter + '" onclick="pickOption(this)">' + esc(q.options[i]) + '</div>';
      }
      h += '</div>';
      h += '<div class="feedback" id="fb-' + q.id + '"></div>';
    } else {
      h += '<button class="reveal-btn" onclick="revealAnswer(\'' + q.id + '\')">查看参考答案与解析</button>';
    }

    h += '<div class="answer-box" id="ab-' + q.id + '">';
    if(q.options && q.options.length){
      var full = '';
      for(var j=0;j<q.options.length;j++){
        if(q.options[j].trim().charAt(0) === q.answer){ full = q.options[j]; break; }
      }
      h += '<div class="answer-line">正确答案：<b>' + esc(full || q.answer) + '</b></div>';
    } else if(q.referenceCode){
      h += '<div class="answer-line"><b>参考程序：</b></div>';
      h += '<pre class="code">' + esc(q.referenceCode) + '</pre>';
    }
    h += '<div class="analysis"><span class="alabel">详细解析</span>' + esc(q.analysis) + '</div>';
    h += '</div></div>';
    return h;
  }

  window.pickOption = function(el){
    var qid = el.getAttribute('data-q');
    var card = document.getElementById('q-' + qid);
    if(card.getAttribute('data-done')) return;
    card.setAttribute('data-done','1');
    var q = findQuestion(qid);
    var chosen = el.getAttribute('data-letter');
    var opts = card.querySelectorAll('.opt');
    for(var i=0;i<opts.length;i++){
      var L = opts[i].getAttribute('data-letter');
      opts[i].classList.add('disabled');
      if(L === q.answer) opts[i].classList.add('correct');
      else if(L === chosen) opts[i].classList.add('wrong');
    }
    var fb = document.getElementById('fb-' + qid);
    if(chosen === q.answer){ fb.textContent = '回答正确！'; fb.className = 'feedback good'; }
    else { fb.textContent = '回答错误，正确答案是 ' + q.answer + '。看看下面的解析吧。'; fb.className = 'feedback bad'; }
    fb.style.display = 'block';
    document.getElementById('ab-' + qid).classList.add('show');
  };

  window.revealAnswer = function(qid){
    document.getElementById('ab-' + qid).classList.add('show');
    var card = document.getElementById('q-' + qid);
    card.setAttribute('data-done','1');
  };

  window.revealAll = function(show){
    var boxes = main.querySelectorAll('.answer-box');
    for(var i=0;i<boxes.length;i++){
      if(show) boxes[i].classList.add('show'); else boxes[i].classList.remove('show');
    }
    if(!show){
      var cards = main.querySelectorAll('.qcard');
      for(var j=0;j<cards.length;j++){
        cards[j].removeAttribute('data-done');
        var fb = cards[j].querySelector('.feedback');
        if(fb) fb.style.display = 'none';
        var opts = cards[j].querySelectorAll('.opt');
        for(var k=0;k<opts.length;k++){ opts[k].classList.remove('correct','wrong','disabled'); }
      }
    }
  };

  function findQuestion(qid){
    var code = qid.split('-')[0];
    var qs = window.EXAM_DATA[code].questions;
    for(var i=0;i<qs.length;i++) if(qs[i].id === qid) return qs[i];
    return null;
  }

  function allQuestionsByKP(kp){
    var out = [];
    for(var i=0;i<EXAM_ORDER.length;i++){
      var qs = window.EXAM_DATA[EXAM_ORDER[i]].questions;
      for(var j=0;j<qs.length;j++) if(qs[j].knowledge === kp) out.push(qs[j]);
    }
    return out;
  }

  function setActive(view){
    var links = document.querySelectorAll('.side-link');
    for(var i=0;i<links.length;i++){
      links[i].classList.toggle('active', links[i].getAttribute('data-view') === view);
    }
  }

  var toolbarHtml = '<div class="toolbar"><button onclick="revealAll(true)">全部显示答案与解析</button><button onclick="revealAll(false)">全部隐藏并重做</button></div>';

  window.showExam = function(code){
    var ex = window.EXAM_DATA[code];
    var h = '<div class="page active">';
    h += '<div class="page-head"><h2>' + esc(ex.title) + ' 羊老师 GESP C++ 六级真题</h2><p>共 ' + ex.questions.length + ' 题。先浏览本卷知识点总结，再逐题作答：点击选项即可判定对错并展开详细解析。</p></div>';
    h += '<div class="section-title">本卷知识点总结</div><div class="ks-grid">';
    for(var i=0;i<ex.knowledgeSummary.length;i++){
      var ks = ex.knowledgeSummary[i];
      h += '<div class="ks-card"><b onclick="showKP(\'' + ks.point + '\')">' + esc(ks.point) + '</b>' + kpTag(ks.point) + '<p>' + esc(ks.desc) + '</p></div>';
    }
    h += '</div>';
    h += toolbarHtml.replace('class="toolbar"','class="toolbar" style="margin-top:16px"');
    var secs = [];
    for(var s=0;s<ex.questions.length;s++){
      if(secs.indexOf(ex.questions[s].section) < 0) secs.push(ex.questions[s].section);
    }
    for(var t=0;t<secs.length;t++){
      h += '<div class="section-title">' + esc(secs[t]) + '</div>';
      for(var u=0;u<ex.questions.length;u++){
        if(ex.questions[u].section === secs[t]) h += renderQuestion(ex.questions[u], false);
      }
    }
    h += '</div>';
    main.innerHTML = h;
    setActive('exam-' + code);
    window.scrollTo(0,0);
  };

  window.showKP = function(kp){
    var qs = allQuestionsByKP(kp);
    var h = '<div class="page active">';
    h += '<div class="page-head"><h2>知识点专题：' + esc(kp) + kpTag(kp) + '</h2><p>先学习下面的课程讲解，再完成 12 套真题中该知识点的全部 ' + qs.length + ' 道汇总题目。每道题都标注了出处试卷。' + kpNote(kp) + '</p></div>';
    h += '<div class="section-title">课程讲解</div>';
    h += '<div class="lesson">' + (window.LESSONS && LESSONS[kp] ? LESSONS[kp] : '<p>本知识点讲解整理中。</p>') + '</div>';
    h += '<div class="section-title">真题汇总演练（' + qs.length + ' 题）</div>';
    if(qs.length){
      h += toolbarHtml;
      for(var i=0;i<qs.length;i++) h += renderQuestion(qs[i], true);
    } else {
      h += '<div class="empty-note">12 套试卷中暂无归入此知识点的题目。</div>';
    }
    h += '</div>';
    main.innerHTML = h;
    setActive('kp-' + kp);
    window.scrollTo(0,0);
  };

  window.showOverview = function(){
    var totalQ = 0, kpCount = {};
    for(var i=0;i<EXAM_ORDER.length;i++){
      var qs = window.EXAM_DATA[EXAM_ORDER[i]].questions;
      totalQ += qs.length;
      for(var j=0;j<qs.length;j++){
        kpCount[qs[j].knowledge] = (kpCount[qs[j].knowledge]||0) + 1;
      }
    }
    var maxC = 1;
    for(var k in kpCount) if(kpCount[k] > maxC) maxC = kpCount[k];
    var h = '<div class="page active">';
    h += '<div class="page-head"><h2>羊老师 GESP C++ 六级真题学习网站</h2><p>收录 2023 年 9 月至 2026 年 6 月共 ' + EXAM_ORDER.length + ' 套真题、' + totalQ + ' 道题目，每题配详细解析。左侧可按试卷逐套练习，或按知识点集中突破：每个知识点均配有课程式讲解与跨试卷题目汇总。</p></div>';
    h += '<div class="stat-grid">';
    h += '<div class="stat-card"><div class="num">' + EXAM_ORDER.length + '</div><div class="lbl">套真题试卷</div></div>';
    h += '<div class="stat-card"><div class="num">' + totalQ + '</div><div class="lbl">道题目全解析</div></div>';
    h += '<div class="stat-card"><div class="num">' + KP_ORDER.length + '</div><div class="lbl">个知识点专题课程</div></div>';
    h += '</div>';
    // 考纲重点内容专项区块
    var focusTotal = 0;
    for(var a=0;a<KP_FOCUS.length;a++) focusTotal += (kpCount[KP_FOCUS[a]]||0);
    h += '<div class="section-title">考纲重点内容（共 ' + FOCUS_SYLLABUS.length + ' 项）</div>';
    h += '<div class="lesson"><p>以下为六级考纲明确要求的重点内容，对应本站知识点专题如下。合计 ' + focusTotal + ' 道真题，占全部 ' + totalQ + ' 题的 ' + Math.round(focusTotal/totalQ*100) + '%，建议优先掌握。橙色"考纲重点"标签即标注这些内容。</p>';
    h += '<table><tr><th>考纲内容</th><th>对应知识点专题（点击进入）</th><th>真题题量</th></tr>';
    for(var x=0;x<FOCUS_SYLLABUS.length;x++){
      var item = FOCUS_SYLLABUS[x], kp = item[1];
      h += '<tr><td>' + esc(item[0]) + '</td><td><b onclick="showKP(\'' + kp + '\')" style="color:var(--brand);cursor:pointer">' + esc(kp) + '</b></td><td>' + (kpCount[kp]||0) + ' 题</td></tr>';
    }
    h += '</table>';
    h += '<p>说明：树的定义/构造/遍历与完全二叉树同属"树与二叉树基础"专题；二叉排序树与二叉树的搜索算法同属"二叉排序树与二叉树搜索"专题；哈夫曼树与哈夫曼编码同属"哈夫曼树与哈夫曼编码"专题；面向对象的思想与类的创建同属"面向对象与类"专题。其余未标注专题（计算机基础知识、链表、排序与分治、代码阅读与程序分析、编程实践）为六级真题涉及的补充考查内容。</p></div>';
    h += '<div class="section-title">知识点考查分布（点击名称进入专题）</div>';
    h += '<div class="legend-note">标注说明：橙色<span class="focus-tag">考纲重点</span>为考纲要求重点掌握的内容（共 ' + FOCUS_SYLLABUS.length + ' 项），对应知识点见上方"考纲重点内容"对照表；侧边栏橙色方块同样标识这些专题。</div>';
    h += '<div class="lesson">';
    for(var m=0;m<KP_ORDER.length;m++){
      var name = KP_ORDER[m], c = kpCount[name] || 0;
      var w = Math.max(4, Math.round(c / maxC * 100));
      h += '<div class="kp-bar-row"><span class="kp-bar-name" onclick="showKP(\'' + name + '\')">' + esc(name) + '</span>' + kpTag(name) + '<div class="kp-bar-track"><div class="kp-bar-fill" style="width:' + w + '%">' + c + ' 题</div></div></div>';
    }
    h += '</div>';
    h += '<div class="section-title">使用建议</div><div class="lesson">';
    h += '<ol><li><b>按卷模考</b>：从左侧"试卷分页"选择一套试卷，先看本卷知识点总结，然后不看答案独立作答，点击选项即时判分。</li>';
    h += '<li><b>按点突破</b>：模考中哪个知识点错得多，就到"知识点汇总"里先读课程讲解，再把 12 套卷中该知识点的题一次刷完。</li>';
    h += '<li><b>错题重做</b>：每个页面顶部提供"全部隐藏并重做"按钮，可清除作答记录重新练习。</li></ol>';
    h += '</div></div>';
    main.innerHTML = h;
    setActive('overview');
    window.scrollTo(0,0);
  };

  window.toggleGroup = function(id){
    document.getElementById(id).classList.toggle('collapsed');
  };

  function buildSidebar(){
    var examNav = document.getElementById('examNav');
    var h = '';
    for(var i=0;i<EXAM_ORDER.length;i++){
      var ex = window.EXAM_DATA[EXAM_ORDER[i]];
      h += '<div class="side-link" data-view="exam-' + ex.code + '" onclick="showExam(\'' + ex.code + '\')"><span>' + esc(ex.title) + '真题</span><span class="badge">' + ex.questions.length + '题</span></div>';
    }
    examNav.innerHTML = h;
    var kpNav = document.getElementById('kpNav');
    var h2 = '';
    for(var j=0;j<KP_ORDER.length;j++){
      var n = allQuestionsByKP(KP_ORDER[j]).length;
      h2 += '<div class="side-link" data-view="kp-' + KP_ORDER[j] + '" onclick="showKP(\'' + KP_ORDER[j] + '\')"><span>' + kpDot(KP_ORDER[j]) + esc(KP_ORDER[j]) + '</span><span class="badge">' + n + '题</span></div>';
    }
    kpNav.innerHTML = h2;
  }

  buildSidebar();
  showOverview();
})();

</script>

</body>
</html>
