    { id: "2506-1", section: "单选题", number: 1, stem: "第 1 题 下列哪一项不是面向对象编程的基本特征？", options: ["A. 继承","B. 封装","C. 多态","D. 链接"], answer: "D", knowledge: "面向对象与类", analysis: "面向对象编程的三大基本特征是封装、继承、多态。链接（linking）是编译连接阶段的概念，不属于 OOP 基本特征，故选 D。" },
    { id: "2506-2", section: "单选题", number: 2, stem: "第 2 题 为了让 Dog 类的构造函数能正确地调用其父类 Animal 的构造方法，横线处应填入（ ）。\nclass Animal {\npublic:\n    std::string name;\n    Animal(std::string str) : name(str) {\n        std::cout << \"Animal created\\n\";\n    }\n    virtual void speak() {\n        cout << \"Animal speaks\" << endl;\n    }\n};\nclass Dog : public Animal {\n    std::string breed;\npublic:\n    Dog(std::string name, std::string b) : _________________, breed(b) {\n        std::cout << \"Dog created\\n\";\n    }\n    void speak() override {\n        cout << \"Dog barks\" << endl;\n    }\n};\nint main() {\n    Animal* p = new Dog(\"Rex\", \"Labrador\");\n    p->speak();\n    delete p;\n    return 0;\n}", options: ["A. Animal(name)","B. super(name)","C. Animal::Animal(name)","D. Animal()"], answer: "A", knowledge: "面向对象与类", analysis: "在 C++ 中，派生类构造函数通过初始化列表调用基类构造函数，语法为 Animal(name)。super 是 Java 等语言的关键字，C++ 中不可用；Animal::Animal(name) 不是合法调用形式；Animal() 未传入参数且基类无默认构造，故编译不过。故选 A。" },
    { id: "2506-3", section: "单选题", number: 3, stem: "第 3 题 代码同上题，代码执行结果是（ ）。", options: ["A. 输出 Animal speaks","B. 输出 Dog barks","C. 编译错误","D. 程序崩溃"], answer: "B", knowledge: "面向对象与类", analysis: "main 中用基类指针 p 指向派生类 Dog 对象，调用虚函数 speak() 时发生动态绑定，执行派生类重写的版本，输出 Dog barks。故选 B。" },
    { id: "2506-4", section: "单选题", number: 4, stem: "第 4 题 以下关于栈和队列的代码，执行后输出是（ ）。\nstack<int> s;\nqueue<int> q;\nfor (int i = 1; i <= 3; ++i) {\n    s.push(i);\n    q.push(i);\n}\ncout << s.top() << \" \" << q.front() << endl;", options: ["A. 1 3","B. 3 1","C. 3 3","D. 1 1"], answer: "B", knowledge: "栈、队列与循环队列", analysis: "依次 push 1、2、3 后，栈顶为 3，队列队首为 1，因此 cout << s.top() << ' ' << q.front() 输出 3 1。故选 B。" },
    { id: "2506-5", section: "单选题", number: 5, stem: "第 5 题 在一个循环队列中，front 是指向队头的指针，rear 指向队尾的指针，队列最大容量为 maxSize。判断队列已满的条件是（ ）。", options: ["A. rear == front","B. (rear + 1) % maxSize == front","C. (rear - 1 + maxSize) % maxSize == front","D. (rear - 1) == front"], answer: "B", knowledge: "栈、队列与循环队列", analysis: "循环队列（牺牲一个单元区分空满）的判满条件为 (rear + 1) % maxSize == front；rear == front 表示队空。故选 B。" },
    { id: "2506-6", section: "单选题", number: 6, stem: "第 6 题 （ ）只有最底层的节点未被填满，且最底层节点尽量靠左填充。", options: ["A. 完美二叉树","B. 完全二叉树","C. 完满二叉树","D. 平衡二叉树"], answer: "B", knowledge: "树与二叉树基础", analysis: "完全二叉树的定义是：除最后一层外其余层都被填满，且最后一层节点尽量靠左排列。完美二叉树要求所有层全满；完满二叉树要求每个节点有 0 或 2 个子节点；平衡二叉树强调左右子树高度差。故选 B。" },
    { id: "2506-7", section: "单选题", number: 7, stem: "第 7 题 在使用数组表示完全二叉树时，如果一个节点的索引为 i（从 0 开始计数），那么其左子节点的索引通常是（ ）。", options: ["A. 2i","B. 2i - 1","C. 2i + 2","D. 2i + 1"], answer: "D", knowledge: "树与二叉树基础", analysis: "数组从 0 开始编号时，节点 i 的左孩子位于 2i+1、右孩子位于 2i+2（若从 1 开始则为 2i 与 2i+1）。本题取 0 基，左孩子为 2i+1，故选 D。" },
    { id: "2506-8", section: "单选题", number: 8, stem: "第 8 题 已知一棵二叉树的前序遍历序列为 GDAFEMHZ，中序遍历序列为 ADFGEHMZ，则其后序遍历序列为（ ）。", options: ["A. ADFGEHMZ","B. ADFGHMEZ","C. AFDGEMZH","D. AFDHZMEG"], answer: "D", knowledge: "树与二叉树基础", analysis: "前序 G 为根；中序以 G 分左右：左子树中序 ADF、右子树中序 EHMZ。递归可得后序为 AFDHZMEG。故选 D。" },
    { id: "2506-9", section: "单选题", number: 9, stem: "第 9 题 设有字符集 {a, b, c, d, e}，其出现频率分别为 {5, 8, 12, 15, 20}，得到的哈夫曼编码为（ ）。", options: ["A. a:010 b:011 c:00 d:10 e:11","B. a:00 b:10 c:011 d:100 e:111","C. a:10 b:01 c:011 d:100 e:111","D. a:100 b:01 c:011 d:100 e:00"], answer: "A", knowledge: "哈夫曼树与哈夫曼编码", analysis: "按频率 5,8,12,15,20 构造哈夫曼树，合并顺序为 (5,8)->13、(12,13)->25、(15,20)->35、(25,35)->60。由此得到前缀编码：a=010、b=011、c=00、d=10、e=11，对应选项 A。故选 A。" },
    { id: "2506-10", section: "单选题", number: 10, stem: "第 10 题 3 位格雷编码中，编码 101 之后的下一个编码不可能是（ ）。", options: ["A. 100","B. 111","C. 110","D. 001"], answer: "C", knowledge: "格雷码", analysis: "3 位格雷码中任意相邻两码仅有一位不同。101 改变一位可得 100（改末位）、111（改中位）、001（改首位），而 110 与 101 有三位不同，不可能是下一个编码。故选 C。" },
    { id: "2506-11", section: "单选题", number: 11, stem: "第 11 题 请将下列 C++ 实现的深度优先搜索（DFS）代码补充完整，横线处应填入（ ）。\nbool visited[1005];\nvoid dfs(int u) {\n    visited[u] = true;\n    for (int v : adj[u]) {\n        if (!visited[v])\n            _________________;\n    }\n}", options: ["A. dfs(v)","B. dfs(u)","C. visited[v] = true","D. return"], answer: "A", knowledge: "深度优先搜索", analysis: "DFS 对未访问的邻接点 v 应递归调用 dfs(v) 以继续深入搜索。选项 B 传参错误（应为 v）；C 仅标记但未递归，无法遍历；D 直接返回会漏掉整棵子树。故选 A。" },
    { id: "2506-12", section: "单选题", number: 12, stem: "第 12 题 给定一个二叉树，返回每一层中最大的节点值，结果以数组形式返回。下列 largestValues 函数使用层序遍历（BFS）实现，横线处应填入（ ）。\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x): val(x), left(nullptr), right(nullptr) {}\n};\nvector<int> largestValues(TreeNode* root) {\n    vector<int> result;\n    if (!root) return result;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        int sz = q.size();\n        int maxVal = INT_MIN;\n        for (int i = 0; i < sz; ++i) {\n            TreeNode* node;\n            ___________________________\n            maxVal = max(maxVal, node->val);\n            if (node->left) q.push(node->left);\n            if (node->right) q.push(node->right);\n        }\n        result.push_back(maxVal);\n    }\n    return result;\n}", options: ["A. node = q.end();","B. node = q.front();","C. node = q.back(); q.pop();","D. node = q.front(); q.pop();"], answer: "D", knowledge: "宽度优先搜索", analysis: "层序遍历（BFS）求每层最大值时，每次需取出队首节点并出队：node = q.front(); q.pop();。选项 A 取 end 非法；B 未出队会导致同一节点被反复处理；C 取队尾不符合层序。故选 D。" },
    { id: "2506-13", section: "单选题", number: 13, stem: "第 13 题 下面代码实现一个二叉排序树的插入函数（没有相同的数值），横线处应填入（ ）。\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x): val(x), left(nullptr), right(nullptr) {}\n};\nvoid insert(TreeNode*& root, int key) {\n    if (!root) {\n        root = new TreeNode(key);\n        return;\n    }\n    _______________________________\n}", options: ["A. if (key < root->val) insert(root->left, key); else if (key > root->val) insert(root->right, key);","B. if (key < root->val) insert(root->right, key); else if (key > root->val) insert(root->left, key);","C. insert(root->left, key); insert(root->right, key);","D. insert(root->right, key); insert(root->left, key);"], answer: "A", knowledge: "二叉排序树与二叉树搜索", analysis: "BST 插入：若 key 小于当前节点值则递归插入左子树，大于则递归插入右子树（题目保证无重复）。选项 B 左右颠倒；C、D 同时插入左右会破坏结构。故选 A。" },
    { id: "2506-14", section: "单选题", number: 14, stem: "第 14 题 以下关于动态规划算法特性的描述，正确的是（ ）。", options: ["A. 子问题相互独立，不重叠","B. 问题包含重叠子问题和最优子结构","C. 只能从底至顶迭代求解","D. 必须使用递归实现，不能使用迭代"], answer: "B", knowledge: "简单动态规划", analysis: "动态规划适用于同时具有重叠子问题和最优子结构的问题；它既可用自顶向下记忆化递归，也可用自底向上迭代，并非只能迭代或必须递归。故选 B。" },
    { id: "2506-15", section: "单选题", number: 15, stem: "第 15 题 给定 n 个物品和一个最大承重为 W 的背包，每个物品有一个重量 wt 和价值 val，每个物品只能选择放或不放。目标是选择若干个物品放入背包，使得总价值最大，且总重量不超过 W。关于下面代码，说法正确的是（ ）。\nint knapsack1D(int W, vector<int>& wt, vector<int>& val, int n) {\n    vector<int> dp(W+1, 0);\n    for (int i = 0; i < n; ++i) {\n        for (int w = W; w >= wt[i]; --w) {\n            dp[w] = max(dp[w], dp[w - wt[i]] + val[i]);\n        }\n    }\n    return dp[W];\n}", options: ["A. 该算法不能处理背包容量为 0 的情况","B. 外层循环 i 遍历背包容量，内层遍历物品","C. 从大到小遍历 w 是为了避免重复使用同一物品","D. 这段代码计算的是最小重量而非最大价值"], answer: "C", knowledge: "简单动态规划", analysis: "该 0/1 背包代码外层遍历物品 i，内层对容量 w 从 W 递减到 wt[i]，递减遍历正是为了避免同一物品被重复使用（保证每个物品最多选一次）。A 中容量为 0 时 dp[0]=0 已正确处理；B 描述内外层颠倒；D 计算的是最大价值。故选 C。" },
    { id: "2506-16", section: "判断题", number: 16, stem: "第 16 题 构造函数可以被声明为 virtual。", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为错误。C++ 中构造函数不能被声明为 virtual：构造对象时虚表尚未建立，且构造函数用于确定对象类型，虚函数机制无意义。" },
    { id: "2506-17", section: "判断题", number: 17, stem: "第 17 题 给定一组字符及其出现的频率，构造出的哈夫曼树是唯一的。", options: [], answer: "", knowledge: "哈夫曼树与哈夫曼编码", analysis: "本题判断为错误。当存在频率相同（或合并时权重相同的节点）时，选取顺序不同会构造出不同的哈夫曼树，因此哈夫曼树一般不唯一（编码也可能不同）。" },
    { id: "2506-18", section: "判断题", number: 18, stem: "第 18 题 为了实现⼀个队列，使其出队操作（pop）的时间复杂度为 O(1) 并且避免数组删除首元素的开销，⼀种常见且有效的方法是使用环形数组，通过调整队首和队尾指针来实现。", options: [], answer: "", knowledge: "栈、队列与循环队列", analysis: "本题判断为正确。用环形（循环）数组实现队列，通过移动 front、rear 指针来出队，出队操作只需修改 front 指针，时间复杂度为 O(1)，避免了顺序表删除首元素后整体前移的开销。" },
    { id: "2506-19", section: "判断题", number: 19, stem: "第 19 题 对⼀棵二叉排序树进行中序遍历，可以得到一个递增的有序序列。", options: [], answer: "", knowledge: "二叉排序树与二叉树搜索", analysis: "本题判断为正确。二叉排序树（BST）的性质是左子树键值小于根、右子树键值大于根，其中序遍历（左-根-右）天然按升序输出，得到递增有序序列。" },
    { id: "2506-20", section: "判断题", number: 20, stem: "第 20 题 如果二叉搜索树在连续的插入和删除操作后，所有节点都偏向一侧，导致其退化为类似于链表的结构，这时其查找、插入、删除操作的时间复杂度会从理想情况下的 O(log n) 退化到 O(n)。", options: [], answer: "", knowledge: "二叉排序树与二叉树搜索", analysis: "本题判断为正确。理想平衡 BST 的查找、插入、删除为 O(log n)；若退化为链表（所有节点偏向一侧），这些操作退化为 O(n)。" },
    { id: "2506-21", section: "判断题", number: 21, stem: "第 21 题 执行下列代码，my_dog.name 的最终值是 Charlie。\nclass Dog {\npublic:\n    std::string name;\n    Dog(std::string str) : name(str) {}\n};\nint main() {\n    Dog my_dog(\"Buddy\");\n    my_dog.name = \"Charlie\";\n    return 0;\n}", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为正确。代码中 Dog my_dog(\"Buddy\") 先用构造函数将 name 设为 Buddy，随后 my_dog.name = \"Charlie\" 直接修改公有成员，最终 name 为 Charlie。" },
    { id: "2506-22", section: "判断题", number: 22, stem: "第 22 题 下列 C++ 代码可以成功编译，并且子类 Child 的实例能通过其成员函数访问父类 Parent 的属性 value。\nclass Parent {\nprivate:\n    int value = 100;\n};\nclass Child : public Parent {\npublic:\n    int get_private_val() {\n        return value;\n    }\n};", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为错误。父类 Parent 的 value 为 private 成员，派生类 Child 不能访问基类的私有成员，get_private_val 中访问 value 会引发编译错误，代码无法成功编译。" },
    { id: "2506-23", section: "判断题", number: 23, stem: "第 23 题 下列代码中的 tree 向量，表示的是一棵完全二叉树（-1 代表空节点）按照层序遍历的结果。\nstd::vector<int> tree = {1, 2, 3, 4, -1, 6, 7};", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为错误。数组 {1,2,3,4,-1,6,7} 按层序表示时，节点 2（索引 1）的左孩子为 4、右孩子为空（-1），但其兄弟节点 3（索引 2）却有子节点 6、7，出现了中间空、后面非空的缺口，不满足完全二叉树最后一层尽量靠左、无空洞的要求，因此不是完全二叉树。" },
    { id: "2506-24", section: "判断题", number: 24, stem: "第 24 题 在树的深度优先搜索（DFS）中，使用栈作为辅助数据结构以实现先进后出的访问顺序。", options: [], answer: "", knowledge: "深度优先搜索", analysis: "本题判断为正确。DFS 借助栈（显式栈或递归调用栈）实现，遵循先进后出（后进先出）的顺序访问节点。" },
    { id: "2506-25", section: "判断题", number: 25, stem: "第 25 题 下面代码采用动态规划求解零钱兑换问题：给定 n 种硬币，第 i 种硬币的面值为 coins[i-1]，目标金额为 amt，每种硬币可以重复选取，求能够凑出目标金额的最少硬币数量；如果不能凑出目标金额，返回 -1。\nint coinChangeDPComp(vector<int> &coins, int amt) {\n    int n = coins.size();\n    int MAX = amt + 1;\n    vector<int> dp(amt + 1, MAX);\n    dp[0] = 0;\n    for (int i = 1; i <= n; i++) {\n        for (int a = 1; a <= amt; a++) {\n            if (coins[i - 1] > a)\n                dp[a] = dp[a];\n            else\n                dp[a] = min(dp[a], dp[a - coins[i - 1]] + 1);\n        }\n    }\n    return dp[amt] != MAX ? dp[amt] : -1;\n}", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为正确。所给代码是经典的硬币找零 DP：dp[a] 表示凑出金额 a 的最少硬币数，初始化 dp[0]=0、其余为 MAX，按币种递推取最小值，最终无法凑出时 dp[amt]==MAX 返回 -1，逻辑正确。" },
    { id: "2506-26", section: "编程题", number: 26, stem: "【编程题 1】学习小组\n班主任计划将班级里 n 名同学划分为若干个学习小组，每名同学都需分入某一小组。若一个小组恰好包含 k 名同学，其讨论积极度为 a[k]。给定数组 a，计算将 n 名同学划分为学习小组的所有方案中，讨论积极度之和的最大值。\n输入格式：第一行一个正整数 n（班级人数）；第二行 n 个非负整数 a_1..a_n，表示不同人数小组的讨论积极度。\n输出格式：一行一个整数，即最大积极度之和。\n样例：\n输入\n4\n1 5 6 3\n输出\n10\n解释：4 人分成两组各 2 人，积极度为 a[2]+a[2]=5+5=10，为最优方案。", options: [], answer: "", knowledge: "简单动态规划", referenceCode: "#include <cstdio>\n#include <algorithm>\nusing namespace std;\nconst int N = 1005;\nint n;\nint a[N];\nint main() {\n    scanf(\"%d\", &n);\n    for (int i = 1; i <= n; i++) {\n        scanf(\"%d\", &a[i]);\n        for (int j = 1; j < i; j++)\n            a[i] = max(a[i], a[j] + a[i - j]);\n    }\n    printf(\"%d\\n\", a[n]);\n    return 0;\n}", analysis: "本题是划分型动态规划。设 dp[i] 表示 i 名同学的最大积极度之和，则 dp[i]=max(a[i], max_{1<=j<i} dp[j]+dp[i-j])。参考程序在读入 a[i] 后，用 j 从 1 到 i-1 不断用 a[j]+a[i-j] 更新 a[i]，由于 j<i 时 a[j]、a[i-j] 已是最优值，最终 a[n] 即为答案。时间复杂度 O(n^2)。" },
    { id: "2506-27", section: "编程题", number: 27, stem: "【编程题 2】最大因数\n给定一棵有 n 个结点的有根树，结点依次以 1 到 n 编号，根结点为 1。对编号 x（2<=x<=n），其父结点为 x 的因数中除 x 外最大的因数。现有 q 组询问，每组给定 x、y，求结点 x 与 y 在树上的距离（连接两结点的简单路径边数）。\n输入格式：第一行一个正整数 q（询问组数）；接下来 q 行，每行两个正整数 x、y。\n输出格式：q 行，每行一个整数，为 x、y 的距离。\n样例 1：\n输入\n3\n1 3\n2 5\n4 8\n输出\n1\n2\n1\n样例 2：\n输入\n1\n120 650\n输出\n9", options: [], answer: "", knowledge: "编程实践", referenceCode: "#include <cstdio>\n#include <algorithm>\nusing namespace std;\nconst int N = 50;\nint q;\nint a[N], cnta;\nint b[N], cntb;\nint f[N], t;\nvoid factorize(int x, int a[], int &cnt) {\n    a[0] = x;\n    t = 0;\n    for (int i = 2; i * i <= x; i++)\n        while (x % i == 0) {\n            f[++t] = i;\n            x /= i;\n        }\n    if (x > 1)\n        f[++t] = x;\n    for (int i = 1; i <= t; i++)\n        a[i] = a[i - 1] / f[i];\n    cnt = t;\n}\nint main() {\n    scanf(\"%d\", &q);\n    while (q--) {\n        int x, y;\n        scanf(\"%d%d\", &x, &y);\n        factorize(x, a, cnta);\n        factorize(y, b, cntb);\n        int px = 0, py = 0;\n        while (a[px] != b[py]) {\n            if (a[px] > b[py])\n                px++;\n            else\n                py++;\n        }\n        printf(\"%d\\n\", px + py);\n    }\n    return 0;\n}", analysis: "本题本质是求树上两结点距离。由于父结点为最大真因数，从任意结点 x 不断除以其最大真因数即可沿唯一路径走到根 1，得到 x 到根的路径（祖先链）。对 x、y 分别求出祖先链后，用双指针（类似求两链表交点）从各自起点向根移动、比较找最近公共祖先 LCA，二者到 LCA 的步数之和即为距离。参考程序用 factorize 生成祖先链，再用 while 循环双指针求交点并输出 px+py。" }
  ]
};

  ],
  questions: [
    { id: "2509-1", section: "单选题", number: 1, stem: "下列关于类的说法，错误的是（ ）。", options: ["A. 构造函数不能声明为虚函数，但析构函数可以。","B. 函数参数如声明为类的引用类型，调用时不会调用该类的复制构造函数。","C. 静态方法属于类而不是某个具体对象，因此推荐用 类名::方法(...) 调用。","D. 不管基类的析构函数是否是虚函数，都可以通过基类指针/引用正确删除派生类对象。"], answer: "D", knowledge: "面向对象与类", analysis: "D 错误。若基类的析构函数不是虚函数，通过基类指针/引用删除派生类对象时，只会调用基类的析构函数，派生类部分不会被正确释放，属于未定义行为。因此必须通过基类指针/引用正确删除派生类对象时，基类析构函数必须声明为虚函数。A、B、C 均正确。" },
    { id: "2509-2", section: "单选题", number: 2, stem: "假设变量 veh 是类 Car 的一个实例，我们可以调用 veh.move()，是因为面向对象编程有（ ）性质。\nclass Vehicle {\nprivate:\n    string brand;\npublic:\n    Vehicle(string b) : brand(b) {}\n    void setBrand(const string& b) { brand = b; }\n    string getBrand() const { return brand; }\n    void move() const {\n        cout << brand << \" is moving...\" << endl;\n    }\n};\nclass Car : public Vehicle {\nprivate:\n    int seatCount;\npublic:\n    Car(string b, int seats) : Vehicle(b), seatCount(seats) {}\n    void showInfo() const {\n        cout << \"This car is a \" << getBrand()\n             << \" with \" << seatCount << \" seats.\" << endl;\n    }\n};", options: ["A. 继承 (Inheritance)","B. 封装 (Encapsulation)","C. 多态 (Polymorphism)","D. 链接 (Linking)"], answer: "A", knowledge: "面向对象与类", analysis: "Car 类通过 public 继承获得 Vehicle 类的 move() 方法，因此 Car 的实例 veh 可以直接调用继承自基类的 move()，这体现了继承（Inheritance）特性。答案选 A。" },
    { id: "2509-3", section: "单选题", number: 3, stem: "下面代码中 v1 和 v2 调用了相同接口 move()，但输出结果不同，这体现了面向对象编程的（ ）特性。\nclass Vehicle {\nprivate:\n    string brand;\npublic:\n    Vehicle(string b) : brand(b) {}\n    void setBrand(const string& b) { brand = b; }\n    string getBrand() const { return brand; }\n    virtual void move() const {\n        cout << brand << \" is moving...\" << endl;\n    }\n};\nclass Car : public Vehicle {\nprivate:\n    int seatCount;\npublic:\n    Car(string b, int seats) : Vehicle(b), seatCount(seats) {}\n    void showInfo() const {\n        cout << \"This car is a \" << getBrand()\n             << \" with \" << seatCount << \" seats.\" << endl;\n    }\n    void move() const override {\n        cout << getBrand() << \" car is driving on the road!\" << endl;\n    }\n};\nclass Bike : public Vehicle {\npublic:\n    Bike(string b) : Vehicle(b) {}\n    void move() const override {\n        cout << getBrand() << \" bike is cycling on the path!\" << endl;\n    }\n};\nint main() {\n    Vehicle* v1 = new Car(\"Toyota\", 5);\n    Vehicle* v2 = new Bike(\"Giant\");\n    v1->move();\n    v2->move();\n    delete v1;\n    delete v2;\n    return 0;\n}", options: ["A. 继承 (Inheritance)","B. 封装 (Encapsulation)","C. 多态 (Polymorphism)","D. 链接 (Linking)"], answer: "C", knowledge: "面向对象与类", analysis: "v1、v2 均为基类 Vehicle* 指针，指向不同的派生类对象，调用同一接口 move() 时，因派生类各自重写了 move() 而输出不同结果，这正是运行时多态（Polymorphism）的体现。答案选 C。" },
    { id: "2509-4", section: "单选题", number: 4, stem: "栈的操作特点是（ ）。", options: ["A. 先进先出","B. 先进后出","C. 随机访问","D. 双端进出"], answer: "B", knowledge: "栈、队列与循环队列", analysis: "栈（stack）是只允许在一端进行插入和删除的线性表，最后入栈的元素最先出栈，即后进先出（LIFO），也常表述为先进后出。A 是队列的特点，C 是数组/向量的特点，D 是双端队列的特点。答案选 B。" },
    { id: "2509-5", section: "单选题", number: 5, stem: "循环队列常用于实现数据缓冲。假设一个循环队列容量为 5（即最多存放 4 个元素，留一个位置区分空与满），依次进行操作：入队数据 1、2、3，出队 1 个数据，再入队数据 4 和 5，此时队首到队尾的元素顺序是（ ）。", options: ["A. [2, 3, 4, 5]","B. [1, 2, 3, 4]","C. [3, 4, 5, 2]","D. [2, 3, 5, 4]"], answer: "A", knowledge: "栈、队列与循环队列", analysis: "依次模拟：入队 1、2、3 后队内为 [1,2,3]；出队 1 个（队首 1）后剩余 [2,3]；再入队 4、5 得到 [2,3,4,5]。因此从队首到队尾的元素顺序为 [2,3,4,5]。答案选 A。" },
    { id: "2509-6", section: "单选题", number: 6, stem: "以下函数 createTree() 构造的树是什么类型？\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\nTreeNode* createTree() {\n    TreeNode* root = new TreeNode(1);\n    root->left = new TreeNode(2);\n    root->right = new TreeNode(3);\n    root->left->left = new TreeNode(4);\n    root->left->right = new TreeNode(5);\n    return root;\n}", options: ["A. 满二叉树","B. 完全二叉树","C. 二叉排序树","D. 其他都不对"], answer: "B", knowledge: "树与二叉树基础", analysis: "该函数构造的树结构为：第 1 层结点 1，第 2 层结点 2、3，第 3 层结点 4、5（均在结点 2 之下，且位于最左侧连续位置）。除最后一层外各层均填满，最后一层结点靠左连续排列，符合完全二叉树的定义。它不是满二叉树（第 3 层未满 4 个），也不是二叉排序树（结点值不满足左小右大）。答案选 B。" },
    { id: "2509-7", section: "单选题", number: 7, stem: "已知二叉树的中序遍历是 [D, B, E, A, F, C]，先序遍历是 [A, B, D, E, C, F]。请问该二叉树的后序遍历结果是（ ）。", options: ["A. [D, E, B, F, C, A]","B. [D, B, E, F, C, A]","C. [D, E, B, C, F, A]","D. [B, D, E, F, C, A]"], answer: "A", knowledge: "树与二叉树基础", analysis: "由先序首元素 A 为根；中序中 A 左侧 [D,B,E] 为左子树、右侧 [F,C] 为右子树。左子树先序 [B,D,E]、中序 [D,B,E]，得 B 为根、D 为左、E 为右；右子树先序 [C,F]、中序 [F,C]，得 C 为根、F 为左。后序为左、右、根：D,E,B,F,C,A。答案选 A。" },
    { id: "2509-8", section: "单选题", number: 8, stem: "完全二叉树可以用数组连续高效存储，如果节点从 1 开始编号，则对有两个孩子节点的节点 i，（ ）。", options: ["A. 左孩子位于 2i，右孩子位于 2i+1","B. 完全二叉树的叶子节点可以出现在最后一层的任意位置","C. 所有节点都有两个孩子","D. 左孩子位于 2i+1，右孩子位于 2i+2"], answer: "A", knowledge: "树与二叉树基础", analysis: "完全二叉树（从 1 开始编号）中，若节点 i 有两个孩子，则左孩子下标为 2i、右孩子下标为 2i+1。B 错（完全二叉树叶子只能出现在最后两层且最后一层靠左）；C 错（不是所有节点都有两孩子）；D 是从 0 开始编号时的公式。答案选 A。" },
    { id: "2509-9", section: "单选题", number: 9, stem: "设有字符集 {a, b, c, d, e, f}，其出现频率分别为 {5, 9, 12, 13, 16, 45}。哈夫曼算法构造最优前缀编码，以下哪一组可能是对应的哈夫曼编码？（非叶子节点左边分支记作 0，右边分支记作 1，左右互换不影响正确性）。", options: ["A. a: 00；b: 01；c: 10；d: 110；e: 111；f: 0","B. a: 1100；b: 1101；c: 100；d: 101；e: 111；f: 0","C. a: 000；b: 001；c: 01；d: 10；e: 110；f: 111","D. a: 10；b: 01；c: 100；d: 101；e: 111；f: 0"], answer: "B", knowledge: "哈夫曼树与哈夫曼编码", analysis: "按频率从小到大反复合并：5+9=14，12+13=25，14+16=30，25+30=55，45+55=100。频率最大的 f(45) 最后合并，编码最短为 1 位（取 0）；其余按合并层次得 a:1100、b:1101、c:100、d:101、e:111、f:0，与选项 B 一致。A 中 a、b、c 与 f 不构成合法前缀树深度；C 编码长度分布与频率不符；D 中 f 与 b 前缀冲突。答案选 B。" },
    { id: "2509-10", section: "单选题", number: 10, stem: "下面代码生成格雷编码，则横线上应填写（ ）。\nvector<string> grayCode(int n) {\n    if (n == 0) return {\"0\"};\n    if (n == 1) return {\"0\", \"1\"};\n    vector<string> prev = grayCode(n-1);\n    vector<string> result;\n    for (string s : prev) {\n        result.push_back(\"0\" + s);\n    }\n    for (_______________) {  // 在此处填写代码\n        result.push_back(\"1\" + prev[i]);\n    }\n    return result;\n}", options: ["A. int i = 0; i < prev.size(); i++","B. int i = prev.size()-1; i >= 0; i--","C. auto s : prev","D. int i = prev.size()/2; i < prev.size(); i++"], answer: "B", knowledge: "格雷码", analysis: "格雷码反射构造法：先将 prev 全部加前缀 0，再逆序复制 prev 并加前缀 1，使相邻编码仅一位不同。横线处循环变量用 i 且循环体访问 prev[i]，并按逆序遍历，即 int i = prev.size()-1; i >= 0; i--。答案选 B。" },
    { id: "2509-11", section: "单选题", number: 11, stem: "请将下列树的深度优先遍历代码补充完整，横线处应填入（ ）。\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x): val(x), left(nullptr), right(nullptr) {}\n};\nvoid dfs(TreeNode* root) {\n    if (!root) return;\n    ______<TreeNode*> temp;     // 在此处填写代码\n    temp.push(root);\n    while (!temp.empty()) {\n        TreeNode* node = temp.top();\n        temp.pop();\n        cout << node->val << \" \";\n        if (node->right) temp.push(node->right);\n        if (node->left) temp.push(node->left);\n    }\n}", options: ["A. vector","B. list","C. queue","D. stack"], answer: "D", knowledge: "深度优先搜索", analysis: "代码中用 temp.top() 取栈顶、temp.push() 入栈、temp.pop() 出栈，这些均为栈（stack）的接口，符合 DFS 用栈（后进先出）实现迭代遍历的方式。vector/list 没有 top 成员，queue 用 front 而非 top。答案选 D。" },
    { id: "2509-12", section: "单选题", number: 12, stem: "令 n 是树的节点数目，下列代码实现了树的广度优先遍历，其时间复杂度是（ ）。\nvoid bfs(TreeNode* root) {\n    if (!root) return;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        TreeNode* node = q.front();\n        q.pop();\n        cout << node->val << \" \";\n        if (node->left) q.push(node->left);\n        if (node->right) q.push(node->right);\n    }\n}", options: ["A. O(n)","B. O(log n)","C. O(n^2)","D. O(1)"], answer: "A", knowledge: "宽度优先搜索", analysis: "BFS 中每个节点恰好入队一次、出队一次，每次出队时仅常数时间处理其孩子，因此总时间复杂度与节点数 n 成正比，为 O(n)。答案选 A。" },
    { id: "2509-13", section: "单选题", number: 13, stem: "在二叉排序树（Binary Search Tree, BST）中查找元素 50，从根节点开始：若根值为 60，则下一步应去搜索（ ）。", options: ["A. 左子树","B. 右子树","C. 随机","D. 根节点"], answer: "A", knowledge: "二叉排序树与二叉树搜索", analysis: "BST 性质：左子树所有结点值小于根，右子树所有结点值大于根。待查 50 小于根值 60，因此下一步应到左子树继续查找。答案选 A。" },
    { id: "2509-14", section: "单选题", number: 14, stem: "删除二叉排序树中的节点时，如果节点有两个孩子，则横线处应填入（ ），其中 findMax 和 findMin 分别为寻找树的最大值和最小值的函数。\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x): val(x), left(nullptr), right(nullptr) {}\n};\nTreeNode* deleteNode(TreeNode* root, int key) {\n    if (!root) return nullptr;\n    if (key < root->val) {\n        root->left = deleteNode(root->left, key);\n    }\n    else if (key > root->val) {\n        root->right = deleteNode(root->right, key);\n    }\n    else {\n        if (!root->left) return root->right;\n        if (!root->right) return root->left;\n        TreeNode* temp = ____________;          // 在此处填写代码\n        root->val = temp->val;\n        root->right = deleteNode(root->right, temp->val);\n    }\n    return root;\n}", options: ["A. root->left","B. root->right","C. findMin(root->right)","D. findMax(root->left)"], answer: "C", knowledge: "二叉排序树与二叉树搜索", analysis: "删除有两个孩子的节点时，标准做法是找该节点的中序后继（即右子树中的最小值）替换其值，再递归删除那个后继节点。横线后紧接着 root->right = deleteNode(root->right, temp->val)，说明 temp 来自右子树，故 temp = findMin(root->right)。答案选 C。" },
    { id: "2509-15", section: "单选题", number: 15, stem: "给定 n 个物品和一个最大承重为 W 的背包，每个物品有一个重量 wt[i] 和价值 val[i]，每个物品只能选择放或不放。目标是选择若干个物品放入背包，使得总价值最大，且总重量不超过 W，则横线上应填写（ ）。\nint knapsack(int W, vector<int>& wt, vector<int>& val, int n) {\n    vector<int> dp(W+1, 0);\n    for (int i = 0; i < n; ++i) {\n        for (int w = W; w >= wt[i]; --w) {\n            ________________________        // 在此处填写代码\n        }\n    }\n    return dp[W];\n}", options: ["A. dp[w] = max(dp[w], dp[w] + val[i]);","B. dp[w] = dp[w - wt[i]] + val[i];","C. dp[w] = max(dp[w - 1], dp[w - wt[i]] + val[i]);","D. dp[w] = max(dp[w], dp[w - wt[i]] + val[i]);"], answer: "D", knowledge: "简单动态规划", analysis: "0/1 背包一维优化：对第 i 件物品，容量 w 处的最大价值，等于“不选第 i 件”（保持 dp[w]）与“选第 i 件”（dp[w-wt[i]]+val[i]）二者取最大值，即 dp[w] = max(dp[w], dp[w-wt[i]]+val[i])；逆序枚举 w 保证每件物品只被选一次。答案选 D。" },
    { id: "2509-16", section: "判断题", number: 16, stem: "当基类可能被多态使用，其析构函数应该声明为虚函数。", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为正确。若通过基类指针/引用删除派生类对象，且基类析构函数非虚，则只会调用基类析构函数，派生类资源无法释放，造成资源泄漏；将基类析构函数声明为虚函数可保证析构时沿继承链正确调用派生类到基类的析构函数。因此当基类可能被多态使用时，析构函数应声明为虚函数。" },
    { id: "2509-17", section: "判断题", number: 17, stem: "哈夫曼编码是最优前缀码，且编码结果唯一。", options: [], answer: "", knowledge: "哈夫曼树与哈夫曼编码", analysis: "本题判断为错误。哈夫曼编码确实是最优前缀码（带权路径长度最小），但编码结果并不唯一：相同频率的节点合并顺序可能不同，且每个非叶子节点的左右分支（0/1）可以互换，这些都不会改变最优性却会得到不同的具体编码。因此“编码结果唯一”这一说法不正确。" },
    { id: "2509-18", section: "判断题", number: 18, stem: "一个含有 n 个节点的完全二叉树，高度为 ⌊log₂n⌋+1（或等价地 ⌈log₂(n+1)⌉）。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。完全二叉树（满二叉树也满足）的层数（高度）与节点数 n 的关系为：高度为 ⌊log₂n⌋+1，等价于 ⌈log₂(n+1)⌉。例如 n=1 时高度为 1，n=3 时高度为 2，n=7 时高度为 3，均符合该公式。" },
    { id: "2509-19", section: "判断题", number: 19, stem: "在 C++ STL 中，栈（std::stack）的 pop 操作返回栈顶元素并移除它。", options: [], answer: "", knowledge: "栈、队列与循环队列", analysis: "本题判断为错误。std::stack::pop() 的返回类型为 void，它仅将栈顶元素移除而不返回该元素；若要获取栈顶元素须先调用 top()，再调用 pop()。因此“pop 返回栈顶元素并移除它”的说法不正确。" },
    { id: "2509-20", section: "判断题", number: 20, stem: "循环队列通过模运算循环使用空间。", options: [], answer: "", knowledge: "栈、队列与循环队列", analysis: "本题判断为正确。循环队列用数组和两个指针 front、rear 表示队首与队尾，入队/出队时通过取模运算 (rear+1)%capacity、(front+1)%capacity 让指针在数组首尾间回绕，从而循环利用已出队释放的空间，避免普通顺序队列的“假溢出”。" },
    { id: "2509-21", section: "判断题", number: 21, stem: "一棵有 n 个节点的二叉树一定有 n-1 条边。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。二叉树是树的一种，树是由 n 个节点通过 n-1 条边连接而成的无环连通结构，因此无论形状如何，n 个节点的二叉树都恰好有 n-1 条边。" },
    { id: "2509-22", section: "判断题", number: 22, stem: "以下代码实现了二叉树的中序遍历。输入以下二叉树，中序遍历结果是 4 2 5 1 3 6。\n//     1\n//    / \\\n//   2   3\n//  / \\   \\\n// 4   5   6\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\nvoid inorderIterative(TreeNode* root) {\n    stack<TreeNode*> st;\n    TreeNode* curr = root;\n    while (curr || !st.empty()) {\n        while (curr) {\n            st.push(curr);\n            curr = curr->left;\n        }\n        curr = st.top(); st.pop();\n        cout << curr->val << \" \";\n        curr = curr->right;\n    }\n}", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。该迭代函数不断将左孩子压栈直到最左，再弹出并访问（输出），然后转向右子树，是标准的“左-根-右”中序遍历。对给定二叉树：先走到 4 输出 4，回到 2 输出 2，再 5 输出 5，回到 1 输出 1，最后右子树 3、6 输出 3、6，序列正是 4 2 5 1 3 6。" },
    { id: "2509-23", section: "判断题", number: 23, stem: "下面代码实现的二叉排序树的查找操作时间复杂度是 O(h)，其中 h 为树高。\nTreeNode* searchBST(TreeNode* root, int val) {\n    while (root && root->val != val) {\n        root = (val < root->val) ? root->left : root->right;\n    }\n    return root;\n}", options: [], answer: "", knowledge: "二叉排序树与二叉树搜索", analysis: "本题判断为正确。该查找每次比较当前节点值后只走向左子树或右子树中的一条，每步下降一层，因此最多访问从根到叶的一条路径上的节点，比较次数为树高 h，时间复杂度为 O(h)。在退化为链表的极端情况下 h=n，复杂度退化为 O(n)。" },
    { id: "2509-24", section: "判断题", number: 24, stem: "下面代码实现了动态规划版本的斐波那契数列计算，其时间复杂度是 O(n)。\nint fib_dp(int n) {\n    if (n <= 1) return n;\n    vector<int> dp(n+1);\n    dp[0] = 0;\n    dp[1] = 1;\n    for (int i = 2; i <= n; i++) {\n        dp[i] = dp[i-1] + dp[i-2];\n    }\n    return dp[n];\n}", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为正确。该实现用数组 dp 自底向上递推，从 i=2 到 n 各计算一次，每步只做常数次加法，因此总时间为 O(n)；空间上用长度为 n+1 的数组，空间复杂度 O(n)。相比朴素递归的指数级复杂度大幅优化。" },
    { id: "2509-25", section: "判断题", number: 25, stem: "有一排香蕉，每个香蕉有不同的甜度值。小猴子想吃香蕉，但不能吃相邻的香蕉。以下代码能找到小猴子吃到最甜的香蕉组合（即所选香蕉甜度之和最大）。\n// bananas：香蕉的甜度\nvoid findSelectedBananas(vector<int>& bananas, vector<int>& dp) {\n    vector<int> selected;\n    int i = bananas.size() - 1;\n    while (i >= 0) {\n        if (i == 0) {\n            selected.push_back(0);\n            break;\n        }\n        if (dp[i] == dp[i-1]) {\n            i--;\n        } else {\n            selected.push_back(i);\n            i -= 2;\n        }\n    }\n    reverse(selected.begin(), selected.end());\n    cout << \"小猴子吃了第: \";\n    for (int idx : selected)\n        cout << idx+1 << \" \";\n    cout << \"个香蕉\" << endl;\n}\nint main() {\n    vector<int> bananas = {1, 2, 3, 1};\n    vector<int> dp(bananas.size());\n    dp[0] = bananas[0];\n    dp[1] = max(bananas[0], bananas[1]);\n    for (int i = 2; i < bananas.size(); i++) {\n        dp[i] = max(bananas[i] + dp[i-2], dp[i-1]);\n    }\n    findSelectedBananas(bananas, dp);\n    return 0;\n}", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为正确。dp[i] 表示前 i+1 个香蕉在不相邻约束下的最大甜度和，状态转移 dp[i]=max(bananas[i]+dp[i-2], dp[i-1]) 即“选当前（跳过前一个）或不选当前”。findSelectedBananas 通过比对 dp[i] 与 dp[i-1] 反向回溯，正确还原出达到最大和的选择方案，因此能找到小猴子吃到的最甜（甜度和最大）香蕉组合。" },
    { id: "2509-26", section: "编程题", number: 26, stem: "编程题 1：划分字符串。小 A 有一个由 n 个小写字母组成的字符串 S。他希望将 S 划分为若干个子串，使得每个子串中每个字母至多出现一次。例如对于 street，str + e + e + t 是满足条件的划分，而 s + tree + t 不是（子串 tree 中 e 出现了两次）。额外地，给出价值数组 a，划分后长度为 len 的子串价值为 a[len]，小 A 希望最大化划分后子串价值之和。\n【输入格式】第一行一个正整数 n（字符串长度）；第二行一个长度为 n 的小写字母字符串 S；第三行 n 个正整数 a[1..n]，表示不同长度子串的价值。\n【输出格式】一行一个整数，表示划分后子串价值之和的最大值。\n【样例 1】输入：\n6\nstreet\n2 1 7 4 3 3\n输出：13（一种最优划分为 str(7) + e(2) + e(2) + t(2) = 13）\n【样例 2】输入：\n8\nblossoms\n1 1 2 3 5 8 13 21\n输出：8（一种最优划分为 b + l + o + s + o + m + s，取单字符价值之和）\n【数据范围】对于所有测试点，保证 n <= 1e5，子串价值 a[len] 为正整数。", options: [], answer: "", knowledge: "简单动态规划", referenceCode: "#include <algorithm>\n#include <cstdio>\n#include <vector>\nusing namespace std;\nconst int N = 1e5 + 5;\nint n;\nchar s[N];\nint a[N];\nlong long f[N];\nint main() {\n    scanf(\"%d\", &n);\n    scanf(\"%s\", s + 1);\n    for (int i = 1; i <= n; i++) scanf(\"%d\", &a[i]);\n    for (int i = 1; i <= n; i++) {\n        int mask = 0;\n        for (int j = i; j; j--) {\n            int cur = 1 << (s[j] - 'a');\n            if (mask & cur) break;\n            mask |= cur;\n            f[i] = max(f[i], f[j - 1] + a[i - j + 1]);\n        }\n    }\n    printf(\"%lld\\n\", f[n]);\n    return 0;\n}", analysis: "思路：设 f[i] 为前缀 S[1..i] 的最优划分价值。枚举以 i 结尾的合法子串 S[j..i]（从 i 向左扩展，用位掩码 mask 记录已出现的字母，遇重复即停止），合法子串长度为 len=i-j+1，其价值为 a[len]，转移 f[i]=max(f[i], f[j-1]+a[len])。由于每个起点向左扩展遇到重复即 break，且子串长度不超过 26，总复杂度 O(26n)。最终输出 f[n]。注意价值可能很大，需用 long long 存储。" },
    { id: "2509-27", section: "编程题", number: 27, stem: "编程题 2：货物运输。A 国有 n 座城市，依次以 1..n 编号，其中 1 号城市为首都。这 n 座城市由 n-1 条双向道路连接，第 i 条道路连接城市 u、v，长度为 w。任意两座城市间均可通过双向道路到达（即城市构成一棵树）。现在需要从首都向各个城市运送货物：满载货物的车队从首都开出，经过一座城市时将对应货物送出，因此车队需要经过所有城市。设计一条路线，在从首都出发经过所有城市的前提下，最小化经过的道路长度总和；一座城市可以经过多次，车队最后可以不返回首都。\n【输入格式】第一行正整数 n；接下来 n-1 行，每行三个整数 u、v、w，表示一条双向道路连接 u、v，长度为 w。\n【输出格式】一行一个整数，表示路线所经过的道路长度总和的最小值。\n【样例 1】输入：\n4\n1 2 6\n1 3 1\n3 4 5\n输出：18（所有边权之和 12，最长路径 1-2 或 1-3-4 长度为 6，2*12-6=18）\n【样例 2】输入：\n7\n1 2 1\n2 3 1\n3 4 1\n7 6 1\n6 5 1\n5 1 1\n输出：9（所有边权之和 6，从首都 1 出发的最长路径长度为 3，2*6-3=9）\n【数据范围】对于所有测试点，保证 n <= 1e5，道路长度 w 为正整数。", options: [], answer: "", knowledge: "深度优先搜索", referenceCode: "#include <algorithm>\n#include <cstdio>\n#include <vector>\nusing namespace std;\nconst int N = 1e5 + 5;\nint n;\nvector<vector<pair<int, int>>> e;\nlong long s, mx;\nvoid dfs(int u, int f, long long d) {\n    mx = max(d, mx);\n    for (auto p : e[u]) {\n        if (p.first != f) { dfs(p.first, u, d + p.second); }\n    }\n}\nint main() {\n    scanf(\"%d\", &n);\n    e.resize(n + 1);\n    for (int i = 1; i < n; i++) {\n        int u, v, w;\n        scanf(\"%d%d%d\", &u, &v, &w);\n        e[u].emplace_back(make_pair(v, w));\n        e[v].emplace_back(make_pair(u, w));\n        s += w;\n    }\n    dfs(1, 0, 0);\n    printf(\"%lld\\n\", s * 2 - mx);\n    return 0;\n}", analysis: "思路：城市构成一棵树。要让车队从首都出发经过所有节点，每条边至少在去和回时被走两次（共 2*总边权），但若把从首都出发走到最远节点（距离首都最远的点，记为直径一端）的那条路径只走一次（不返回），就可省下该路径长度的回程。因此最小总路程 = 2*（所有边权之和） - （从首都 1 出发能到达的最远节点的距离 mx）。参考程序用 DFS 从节点 1 出发计算到每个节点的距离并记录最大值 mx，s 累计所有边权，最后输出 s*2 - mx。注意用 long long。" }

    { id: "2603-12", section: "单选题", number: 12, stem: "给定一棵二叉树，采用广度优先搜索(BFS)算法返回右视图所有节点的值（右视图即从右侧看过去每层最右侧的节点）。下面是参考实现，请补全代码中的横线：\nstruct TreeNode { int val; TreeNode* left; TreeNode* right; TreeNode(int x): val(x), left(nullptr), right(nullptr) {} };\nvector<int> rightSideView(TreeNode* root) {\n    unordered_map<int, int> rightmostValueAtDepth;\n    int max_depth = -1;\n    queue<TreeNode*> nodeQueue; queue<int> depthQueue;\n    nodeQueue.push(root); depthQueue.push(0);\n    while (!nodeQueue.empty()) {\n        TreeNode* node = nodeQueue.front(); nodeQueue.pop();\n        int depth = depthQueue.front(); depthQueue.pop();\n        if (node != NULL) {\n            max_depth = max(max_depth, depth);\n            rightmostValueAtDepth[depth] = node->val;\n            nodeQueue.push(node->left); nodeQueue.push(node->right);\n            depthQueue.push(________);\n            depthQueue.push(________);\n        }\n    }\n    vector<int> rightView;\n    for (int depth = 0; ________; ++depth) {\n        rightView.push_back(rightmostValueAtDepth[depth]);\n    }\n    return rightView;\n}\n三个横线依次应填入？", options: ["A. depth、depth、depth < max_depth","B. depth + 1、depth + 1、depth <= max_depth","C. depth + 1、depth + 1、depth < max_depth","D. depth、depth、depth <= max_depth"], answer: "B", knowledge: "宽度优先搜索", analysis: "BFS 层序遍历时，将节点入队的同时把对应深度入队。左、右孩子的深度均为父节点深度+1，故两处横线均填 depth+1；最后按深度从 0 到 max_depth 收集每层最右值，循环条件应为 depth <= max_depth（包含最深一层）。故选 B。" },

    { id: "2603-14", section: "单选题", number: 14, stem: "小朋友们去邻里拜年，每个家里有不同数量的糖果。规则是：不能连续进入两个相邻的房子（即不能同时取相邻两家的糖果）。目标是拿到最多糖果。以下是代码实现，请补全横线。\nint visit(vector<int>& nums) {\n    if (nums.empty()) return 0;\n    int size = nums.size();\n    if (size == 1) return nums[0];\n    vector<int> dp = vector<int>(size, 0);\n    dp[0] = nums[0];\n    dp[1] = max(nums[0], nums[1]);\n    for (int i = 2; i < size; i++) {\n        dp[i] = ______;\n    }\n    return dp[size - 1];\n}", options: ["A. dp[i] = dp[i - 1] + nums[i];","B. dp[i] = max(dp[i - 1], dp[i - 2] * nums[i]);","C. dp[i] = max(dp[i - 1], dp[i - 2] + nums[i]);","D. dp[i] = dp[i - 2] + nums[i];"], answer: "C", knowledge: "简单动态规划", analysis: "不能选相邻房屋，即选了 i 就不能选 i-1，状态转移为 dp[i]=max(dp[i-1], dp[i-2]+nums[i])。A、D 漏掉 max，B 误用乘法。故选 C。" },
    { id: "2603-15", section: "单选题", number: 15, stem: "元宵节晚上，小朋友沿着一条发光石板路前进，每次可向前走 1 块或 2 块石板。动态规划定义如下：dp[i] = dp[i - 1] + dp[i - 2]，下面关于 dp[i] 的含义最合适的是（ ）。", options: ["A. 走到第 i 块石板的不同走法数量","B. 走到第 i 块石板时，已经走过的石板总数","C. 从第 i 块石板走回起点的最少步数","D. 从第 i 块石板走回起点的最大步数"], answer: "A", knowledge: "简单动态规划", analysis: "每次走 1 或 2 块石板，到达第 i 块的不同走法数满足 dp[i]=dp[i-1]+dp[i-2]（斐波那契），故 dp[i] 表示走到第 i 块石板的不同走法数量。故选 A。" },
    { id: "2603-16", section: "判断题", number: 16, stem: "下面定义了一个表示二维坐标点的类 Point，并提供了一个带参数的构造函数，但第 ② 行 Point b; 会调用编译器自动生成的默认构造函数，将 b.x 和 b.y 被初始化为 0.0，程序可以正常编译运行。", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为错误。类 Point 声明了带参构造函数 Point(double,double)，编译器不再隐式生成默认构造函数，因此 Point b; 会因找不到默认构造函数而编译失败，程序无法正常运行。" },
    { id: "2603-17", section: "判断题", number: 17, stem: "C++ 中的继承支持单继承和多继承，但子类无法直接访问父类的私有成员。", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为正确。C++ 支持单继承与多继承，但父类的 private 成员对子类不可见，子类无法直接访问。" },
    { id: "2603-18", section: "判断题", number: 18, stem: "对如下结构的树（根1，左2右3；2的左4右5），执行 travel 函数，输出结果是 1 2 3 4 5。\nvoid travel(Node* root) {\n    if (!root) return;\n    stack<Node*> s; s.push(root);\n    while (!s.empty()) {\n        Node* cur = s.top(); s.pop();\n        cout << cur->val << \" \";\n        if (cur->right) s.push(cur->right);\n        if (cur->left)  s.push(cur->left);\n    }\n}", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为错误。travel 函数用栈实现非递归先序遍历：先压右孩子再压左孩子，保证左子树先访问。对给定树输出顺序为 1 2 4 5 3，而非 1 2 3 4 5。" },
    { id: "2603-19", section: "判断题", number: 19, stem: "若所有字符出现频率相同，则哈夫曼编码一定会得到完全二叉树。", options: [], answer: "", knowledge: "哈夫曼树与哈夫曼编码", analysis: "本题判断为错误。当各字符频率相同时，哈夫曼算法的合并顺序不唯一，得到的树形未必是满二叉树或完全二叉树（例如 5 个等频字符可能得到叶子深度分别为 1 和 3 的树），因此不能说一定得到完全二叉树。" },
    { id: "2603-20", section: "判断题", number: 20, stem: "哈夫曼编码是一种变长的前缀编码，在解码时不需要额外的分隔符就能唯一还原，这是因为在哈夫曼树中，任何一个字符的叶子结点都不会成为另一个字符结点的祖先。", options: [], answer: "", knowledge: "哈夫曼树与哈夫曼编码", analysis: "本题判断为正确。哈夫曼编码是前缀编码，任一字符的编码都不是另一字符编码的前缀，等价于哈夫曼树中任何叶子结点都不是另一叶子结点的祖先，因此解码无需分隔符即可唯一还原。" },
    { id: "2603-21", section: "判断题", number: 21, stem: "在 C++ 中使用一维数组 vector<int> tree 存储按层序遍历的完全二叉树时，若根节点存储在 tree[0]，则对于任意非空节点 tree[i]，其右孩子（如果存在）必然位于 tree[2 * i + 2]。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。完全二叉树按层序从 0 开始存入一维数组时，节点 i 的左孩子下标为 2i+1、右孩子为 2i+2，故右孩子位于 tree[2*i+2]。" },
    { id: "2603-22", section: "判断题", number: 22, stem: "在 C++ 中使用栈来非递归地实现二叉树的前序遍历时，为了保证遍历顺序正确，在处理完当前结点后，应该先将该结点的左孩子压入栈中，然后再将右孩子压入栈中。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为错误。非递归前序遍历需保证'根-左-右'顺序；由于栈后进先出，处理完当前结点后应先将右孩子压栈、再将左孩子压栈，使左孩子先出栈先访问。若先压左后压右，访问顺序变为根-右-左，错误。" },
    { id: "2603-23", section: "判断题", number: 23, stem: "设二叉树共有 n 个结点，函数 preorderTraversal（递归先序遍历）的时间复杂度为 O(n)，空间复杂度为 O(n)。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。递归先序遍历每个结点仅访问一次，时间复杂度 O(n)；递归调用栈在最坏情况（退化链表）下深度达 n，空间复杂度 O(n)，故说法正确。" },
    { id: "2603-24", section: "判断题", number: 24, stem: "下列代码实现了一个 0-1 背包的一维动态规划代码，内层循环是经典的逆序写法。若将内层循环改成顺序遍历（即 for (int j = w[i]; j <= W; j++)），仍能得到正确答案。", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为错误。0-1 背包一维 DP 必须逆序更新，以保证每个物品只被使用一次；若改为正序遍历，同一物品会被重复使用，退化为完全背包，无法得到 0-1 背包的正确答案。" },
    { id: "2603-25", section: "判断题", number: 25, stem: "在动态规划问题中，状态空间相同且没有重复计算的情况下，'状态转移方程 + 递推'与'递归 + 记忆化搜索'的时间复杂度通常相同。", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为正确。在状态空间相同且均避免重复计算时，自底向上的'状态转移+递推'与自顶向下的'递归+记忆化搜索'都只计算每个状态一次，时间复杂度通常相同。" },
    { id: "2603-26", section: "编程题", number: 26, stem: "试题名称：选数。给定两个长度均为 n 的数组 a 与 b。你需要选择若干个下标 i（1 ≤ i ≤ n），使得若选择了下标 i，则下一个被选下标至少为 i + b[i]（即任意两个被选下标 i < j 满足 j - i ≥ b[i]）。目标是在满足条件的前提下，最大化所选下标的 a 值之和。\n输入格式：第一行一个正整数 n；第二行 n 个整数 a[1..n]；第三行 n 个整数 b[1..n]。\n输出格式：一行一个整数，表示 a 值之和的最大值。\n样例输入1：\n4\n1 2 3 4\n3 3 1 1\n样例输出1：7\n样例输入2：\n6\n1 1 4 5 1 4\n1 2 3 2 1 0\n样例输出2：11", options: [], answer: "", knowledge: "简单动态规划", referenceCode: "#include <cstdio>\n#include <algorithm>\nusing namespace std;\nconst int N = 1e5 + 5;\nint n;\nint a[N], b[N];\nlong long f[N], ans;\nint main() {\n    scanf(\"%d\", &n);\n    for (int i = 1; i <= n; i++)\n        scanf(\"%d\", &a[i]);\n    for (int i = 1; i <= n; i++)\n        scanf(\"%d\", &b[i]);\n    for (int i = 1; i <= n; i++) {\n        ans = max(ans, f[i] + a[i]);\n        if (i + b[i] <= n)\n            f[i + b[i]] = max(f[i + b[i]], f[i] + a[i]);\n        f[i + 1] = max(f[i + 1], f[i]);\n    }\n    printf(\"%lld\\n\", ans);\n    return 0;\n}", analysis: "设 f[i] 表示考虑到位置 i（不强制选 i）时的最大收益。对每个 i：若选择 i，则获得 a[i] 并跳到 i+b[i]，故 f[i+b[i]] 可由 f[i]+a[i] 更新；f[i] 也可顺延到 i+1。答案在所有 f[i]+a[i] 中取最大值，时间复杂度 O(n)。" },
    { id: "2603-27", section: "编程题", number: 27, stem: "试题名称：完全二叉树。给定一棵包含 n 个结点的有根二叉树，结点以 1..n 编号，根结点为 1。对每个结点 i，给出其左儿子编号 l[i]、右儿子编号 r[i]（不存在则为 0）。每个结点都对应一棵以其为根的子树。求所有 n 棵子树中有多少棵是完全二叉树。\n输入格式：第一行一个正整数 n；接下来 n 行每行两个整数 l[i]、r[i]。\n输出格式：一行一个整数，表示完全二叉树子树的数量。\n样例输入1：\n4\n2 3\n4 0\n0 0\n0 0\n样例输出1：4\n样例输入2：\n4\n2 3\n0 0\n4 0\n0 0\n样例输出2：3", options: [], answer: "", knowledge: "深度优先搜索", referenceCode: "#include <cstdio>\n#include <algorithm>\nusing namespace std;\nconst int N = 1e5 + 5;\nint n;\nint l[N], r[N];\nint mn[N], mx[N], chk[N];\nint ans;\nvoid dfs(int u) {\n    chk[u] = 1;\n    if (!u)\n        return;\n    dfs(l[u]);\n    dfs(r[u]);\n    chk[u] &= chk[l[u]] & chk[r[u]];\n    mn[u] = 1 + min(mn[l[u]], mn[r[u]]);\n    mx[u] = 1 + max(mx[l[u]], mx[r[u]]);\n    chk[u] &= mn[l[u]] >= mx[r[u]];\n    chk[u] &= mn[u] >= mx[u] - 1;\n    ans += chk[u];\n}\nint main() {\n    scanf(\"%d\", &n);\n    for (int i = 1; i <= n; i++)\n        scanf(\"%d%d\", &l[i], &r[i]);\n    dfs(1);\n    printf(\"%d\\n\", ans);\n    return 0;\n}", analysis: "对每个子树用 DFS 计算最小深度 mn、最大深度 mx 及是否完全 chk。完全二叉树要求：左右子树都完全（chk[l]&chk[r]）；左子树最小深度不小于右子树最大深度（保证先填满左）；当前子树最大最小深度差不超过 1（mn[u]>=mx[u]-1）。DFS 过程中累计满足条件的子树个数即为答案，时间复杂度 O(n)。" }
  ]
};

  questions: [
    { id: "2606-1", section: "单选题", number: 1, stem: "第 1 题 下列关于 C++ 中继承和多态的描述中，错误的是（ ）。", options: ["A. 通过基类指针调用虚函数时，会根据对象实际类型决定调用版本。", "B. 基类析构函数常声明为虚函数，以便通过基类指针正确释放派生类对象。", "C. 派生类可以重写基类中的虚函数。", "D. 构造函数可以声明为 virtual，以便在构造对象时实现动态绑定。"], answer: "D", knowledge: "面向对象与类", analysis: "构造函数不能声明为 virtual。C++ 中虚函数机制依赖对象内部的虚函数表指针（vptr），而构造函数在对象创建、vptr 尚未初始化完成时执行，因此语言禁止将构造函数声明为虚函数。A、B、C 均为继承与多态的正确描述：基类指针调用虚函数发生动态绑定；基类析构函数通常声明为虚函数以保证通过基类指针析构时正确调用派生类析构函数；派生类可重写基类虚函数。故错误的是 D。" },
    { id: "2606-2", section: "单选题", number: 2, stem: "第 2 题 下列代码中，d1->work(); 和 d2->work(); 输出不同结果的主要原因是（ ）。\nclass Device {\npublic:\n    virtual void work() { cout << \"Device is working\" << endl; }\n    virtual ~Device() {}\n};\nclass Printer : public Device {\npublic:\n    void work() override { cout << \"Printer is printing\" << endl; }\n};\nclass Scanner : public Device {\npublic:\n    void work() override { cout << \"Scanner is scanning\" << endl; }\n};\nint main() {\n    Device* d1 = new Printer();\n    Device* d2 = new Scanner();\n    d1->work();\n    d2->work();\n    delete d1; delete d2;\n    return 0;\n}", options: ["A. Printer 和 Scanner 使用了相同的构造函数。", "B. work() 是虚函数，且 d1 和 d2 实际指向不同派生类对象，发生动态绑定。", "C. d1 和 d2 是不同的指针变量。", "D. 程序中使用了 delete 释放对象。"], answer: "B", knowledge: "面向对象与类", analysis: "Device 的 work() 声明为 virtual，Printer、Scanner 各自重写了 work()。main 中 d1、d2 均为基类指针，分别指向 Printer、Scanner 派生类对象，调用 work() 时根据对象实际类型发生动态绑定，分别输出 Printer is printing 与 Scanner is scanning。输出不同的根本原因是虚函数 + 实际指向不同派生类对象。A 中二者构造函数无关；C 指针变量不同但不是原因；D 的 delete 与输出结果无关。故选 B。" },
    { id: "2606-3", section: "单选题", number: 3, stem: "第 3 题 下面代码在 main() 中有一行会导致编译错误，请找出来。\nclass Student {\npublic:\n    Student(string n, int s) : name(n), score(s) {}\n    string getName() { return name; }\n    void setScore(int s) { score = s; }\nprivate:\n    string name;\n    int score;\n};\nint main() {\n    Student stu(\"Tom\", 85);\n    cout << stu.getName();   // ①\n    stu.setScore(90);        // ②\n    stu.score = 100;         // ③\n    cout << stu.getName();   // ④\n    return 0;\n}", options: ["A. 第 ① 行", "B. 第 ② 行", "C. 第 ③ 行", "D. 第 ④ 行"], answer: "C", knowledge: "面向对象与类", analysis: "Student 类的成员变量 name、score 为 private，类外不可直接访问。main 中第 ③ 行 stu.score = 100; 试图在类外直接修改私有成员 score，会导致编译错误。第 ① 行调用公有成员 getName()、第 ② 行调用公有成员 setScore()、第 ④ 行再次调用 getName() 均合法。故编译错误在第 ③ 行，选 C。" },
    { id: "2606-4", section: "单选题", number: 4, stem: "第 4 题 某文本编辑器把用户输入的字符依次压入栈 S。用户依次输入 X, Y, Z, W 后，连续执行两次撤销操作。每次撤销都会弹出栈顶一个字符。此时栈从栈底到栈顶的内容是（ ）。", options: ["A. X Y", "B. X Y Z", "C. Y Z", "D. X Z"], answer: "A", knowledge: "栈、队列与循环队列", analysis: "依次压入 X、Y、Z、W 后，栈自底向顶为 X Y Z W。两次撤销各弹出栈顶一个字符，依次弹出 W、Z，剩余 X、Y，自底向顶仍为 X Y。故选 A。" },
    { id: "2606-5", section: "单选题", number: 5, stem: "第 5 题 假设循环队列数组长度为 N = 7，队空判断条件为 front == rear。入队和出队操作如下：\nconst int N = 7;\nint q[N];\nint front = 3, rear = 3;\nvoid enqueue(int x) { q[rear] = x; rear = (rear + 1) % N; }\nvoid dequeue() { front = (front + 1) % N; }\nenqueue(10); enqueue(20); enqueue(30); dequeue(); enqueue(40); dequeue(); enqueue(50);\n最终 (front, rear) 的值是（ ）。", options: ["A. (5, 1)", "B. (4, 0)", "C. (5, 0)", "D. (3, 1)"], answer: "A", knowledge: "栈、队列与循环队列", analysis: "初始 front=3, rear=3。enqueue(10): q[3]=10, rear=4。enqueue(20): q[4]=20, rear=5。enqueue(30): q[5]=30, rear=6。dequeue(): front=4。enqueue(40): q[6]=40, rear=0。dequeue(): front=5。enqueue(50): q[0]=50, rear=1。最终 (front, rear) = (5, 1)。故选 A。" },
    { id: "2606-6", section: "单选题", number: 6, stem: "第 6 题 以下函数 check() 用于判断一棵二叉树是否为（ ）。\nbool check(TreeNode* root) {\n    if (!root) return true;\n    queue<TreeNode*> q;\n    q.push(root);\n    bool hasNull = false;\n    while (!q.empty()) {\n        TreeNode* cur = q.front();\n        q.pop();\n        if (cur == nullptr) { hasNull = true; }\n        else {\n            if (hasNull) return false;\n            q.push(cur->left);\n            q.push(cur->right);\n        }\n    }\n    return true;\n}", options: ["A. 满二叉树", "B. 完全二叉树", "C. 二叉搜索树", "D. 平衡二叉树"], answer: "B", knowledge: "树与二叉树基础", analysis: "check 用层序遍历（队列）扫描二叉树，遇到空结点置 hasNull=true，此后若再遇到非空结点则返回 false。这正是完全二叉树的定义：除最后一层外各层填满，最后一层结点靠左排列，层序遍历中一旦出现空结点，其后不能再有非空结点。故该函数判断是否为完全二叉树，选 B。" },
    { id: "2606-7", section: "单选题", number: 7, stem: "第 7 题 以下代码实现了二叉树的哪种遍历方式？\nvoid traverse(TreeNode* root) {\n    if (root == nullptr) return;\n    cout << root->val << \" \";\n    traverse(root->left);\n    traverse(root->right);\n}", options: ["A. 前序遍历", "B. 中序遍历", "C. 后序遍历", "D. 层序遍历"], answer: "A", knowledge: "树与二叉树基础", analysis: "traverse 先访问根结点（输出 root->val），再递归遍历左子树，最后递归遍历右子树，符合「根-左-右」的前序遍历顺序。故选 A。" },
    { id: "2606-8", section: "单选题", number: 8, stem: "第 8 题 已知一棵二叉树的先序遍历序列为：A B D E H C F G，中序遍历序列为：D B H E A F C G，则该二叉树的后序遍历序列是（ ）。", options: ["A. D H E B F G C A", "B. D E H B F G C A", "C. H D E B F C G A", "D. D H E B G F C A"], answer: "A", knowledge: "树与二叉树基础", analysis: "先序 A B D E H C F G，中序 D B H E A F C G。由先序首位 A 为根，中序中 A 左侧 D B H E 为左子树、右侧 F C G 为右子树。左子树先序 B D E H：B 为根，中序 D B H E 中 D 在 B 左、H E 在 B 右；E 的先序为 E H、中序 H E，故 H 为 E 左孩子。右子树先序 C F G：C 为根，中序 F C G 中 F 在左、G 在右。后序为左子树 D H E B、右子树 F G C、根 A，即 D H E B F G C A。故选 A。" },
    { id: "2606-9", section: "单选题", number: 9, stem: "第 9 题 有 5 个字符，它们出现的次数（频率）分别为 2、3、5、8、13，现在用哈夫曼编码为这些字符编码，最小加权路径长度 WPL 的值为（ ）。", options: ["A. 60", "B. 64", "C. 68", "D. 72"], answer: "B", knowledge: "哈夫曼树与哈夫曼编码", analysis: "对频率 2、3、5、8、13 构造哈夫曼树，每次合并权值最小的两棵：2+3=5，5+5=10，8+10=18，13+18=31。WPL 等于所有合并产生的内部结点权值之和 = 5+10+18+31 = 64。故选 B。" },
    { id: "2606-10", section: "单选题", number: 10, stem: "第 10 题 对 n 个不同符号进行哈夫曼编码。若生成的哈夫曼树共有 19 个结点，则 n 的值是（ ）。", options: ["A. 9", "B. 10", "C. 11", "D. 12"], answer: "B", knowledge: "哈夫曼树与哈夫曼编码", analysis: "对 n 个符号做哈夫曼编码，生成的哈夫曼树共有 n 个叶子（对应 n 个符号），且除叶外每个内部结点都由两棵子树合并而来，因此总结点数为 2n-1。已知总结点 19，有 2n-1=19，解得 n=10。故选 B。" },
    { id: "2606-11", section: "单选题", number: 11, stem: "第 11 题 在格雷码中，相邻两个编码只能有一位不同。若当前编码为 110，则它的下一个编码不可能是（ ）。", options: ["A. 010", "B. 111", "C. 100", "D. 001"], answer: "D", knowledge: "格雷码", analysis: "格雷码相邻两码仅允许一位不同。当前 110：与 010 仅第 2 位不同（1 位），可能；与 111 仅第 3 位不同（1 位），可能；与 100 仅第 2 位不同（1 位），可能；与 001 相比第 1、2、3 位均不同（3 位），不可能。故下一个编码不可能是 001，选 D。" },
    { id: "2606-12", section: "单选题", number: 12, stem: "第 12 题 给定一棵二叉树，采用广度优先搜索 BFS 返回其右视图，其中右视图中的每个节点都是该层最右侧的节点。横线处应填写（ ）。\nvector<int> rightSideView(TreeNode* root) {\n    vector<int> result;\n    if (!root) return result;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        int sz = q.size();\n        for (int i = 0; i < sz; ++i) {\n            TreeNode* node = q.front();\n            q.pop();\n            __________________________\n            if (node->left) q.push(node->left);\n            if (node->right) q.push(node->right);\n        }\n    }\n    return result;\n}", options: ["A. if (i == 0) result.push_back(node->val);", "B. if (i == sz - 1) result.push_back(node->val);", "C. result.push_back(q.front()->val);", "D. if (node->right) result.push_back(node->right->val);"], answer: "B", knowledge: "宽度优先搜索", analysis: "BFS 按层遍历，内层 for 循环处理当前层 sz 个结点；该层最右侧结点为循环最后一个（i == sz-1）被弹出的结点。在其处将 node->val 加入结果即为右视图。A 取最左；C 取队首（已弹出后为空）；D 仅当存在右孩子才记录，会漏掉最右结点实为左孩子的情况。故选 B。" },
    { id: "2606-13", section: "单选题", number: 13, stem: "第 13 题 下面代码实现二叉搜索树的插入操作。假设树中不存在重复值，横线处应填写（ ）。\nTreeNode* insertNode(TreeNode* root, int x) {\n    if (root == nullptr) { return new TreeNode(x); }\n    if (x < root->val) {\n        __________________________\n    } else {\n        root->right = insertNode(root->right, x);\n    }\n    return root;\n}", options: ["A. root->left = insertNode(root->left, x);", "B. root = insertNode(root->left, x);", "C. root->right = insertNode(root->left, x);", "D. insertNode(root->left, x);"], answer: "A", knowledge: "二叉排序树与二叉树搜索", analysis: "二叉搜索树插入：x < root->val 时应插入左子树，需将递归返回值赋回 root->left 以更新（并可能新建）左子树指针；否则插入右子树。横线处应为 root->left = insertNode(root->left, x);。B 未写回 left；C 误写入 right；D 未接收返回值导致新建结点丢失。故选 A。" },
    { id: "2606-14", section: "单选题", number: 14, stem: "第 14 题 给定一个整数数组 a，每个元素表示一个位置上的数值。要求从数组中选择若干个元素，使得任意两个被选择的元素在原数组中都不相邻，并且所选元素的总和最大。函数 choose(vector<int>& a) 返回能够得到的最大总和，则横线处应填写（ ）。\nint choose(vector<int>& a) {\n    if (a.empty()) return 0;\n    int n = a.size();\n    if (n == 1) return a[0];\n    vector<int> dp(n, 0);\n    dp[0] = a[0];\n    dp[1] = max(a[0], a[1]);\n    for (int i = 2; i < n; ++i) {\n        dp[i] = __________________________;\n    }\n    return dp[n - 1];\n}", options: ["A. dp[i - 1] + a[i]", "B. max(dp[i - 1], dp[i - 2] + a[i])", "C. max(dp[i - 2], a[i])", "D. dp[i - 1] + dp[i - 2]"], answer: "B", knowledge: "简单动态规划", analysis: "经典「打家劫舍」模型。dp[i] 表示前 i 个元素中不相邻选取的最大和。对第 i 个元素，要么不选（继承 dp[i-1]），要么选（与前一个不相邻，取 dp[i-2]+a[i]），故 dp[i] = max(dp[i-1], dp[i-2]+a[i])。A 强制选；C 漏了不选分支；D 两状态相加无意义。故选 B。" },
    { id: "2606-15", section: "单选题", number: 15, stem: "第 15 题 下面代码实现 0/1 背包的一维动态规划。第 i 个物品重量为 wt[i]，价值为 val[i]，背包容量为 W。横线处应填写（ ）。\nint knapsack(int W, vector<int>& wt, vector<int>& val) {\n    int n = wt.size();\n    vector<int> dp(W + 1, 0);\n    for (int i = 0; i < n; ++i) {\n        for (int w = W; w >= wt[i]; --w) {\n            __________________________\n        }\n    }\n    return dp[W];\n}", options: ["A. dp[w] = max(dp[w], dp[w - wt[i]] + val[i]);", "B. dp[w] = max(dp[w - 1], dp[w - wt[i]] + val[i]);", "C. dp[w] = dp[w] + val[i];", "D. dp[w - wt[i]] = max(dp[w], val[i]);"], answer: "A", knowledge: "简单动态规划", analysis: "0/1 背包一维优化，容量倒序枚举避免重复装入。对第 i 件物品，若不装入则 dp[w] 不变，若装入则转移到 dp[w-wt[i]]+val[i]，取较大值：dp[w] = max(dp[w], dp[w-wt[i]]+val[i])。B 用 dp[w-1] 错误；C 直接累加会重复装入；D 写反了目标与来源。故选 A。" },

    { id: "2606-16", section: "判断题", number: 16, stem: "第 1 题 C++ 中构造函数可以声明为虚函数，从而实现运行时多态。", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为错误。C++ 中构造函数不能声明为虚函数。虚函数依赖对象内的虚表指针，而构造函数执行时对象尚未完全构造、虚表指针尚未就绪，语言禁止将构造函数声明为 virtual，因此无法借此实现运行时多态。" },
    { id: "2606-17", section: "判断题", number: 17, stem: "第 2 题 通过指向 Base 的指针删除 Derived 对象时，一定会先调用 Derived 的析构函数，再调用 Base 的析构函数。\nclass Base {\npublic:\n    ~Base() { cout << \"Base destructor\" << endl; }\n};\nclass Derived : public Base {\npublic:\n    ~Derived() { cout << \"Derived destructor\" << endl; }\n};\nint main() {\n    Base* p = new Derived();\n    delete p;\n    return 0;\n}", options: [], answer: "", knowledge: "面向对象与类", analysis: "本题判断为错误。示例 Base 的析构函数未声明为 virtual。通过基类指针 p（指向 Derived 对象）执行 delete p 时，因析构函数非虚，仅按指针静态类型调用 Base::~Base()，不会调用 Derived 的析构函数，可能造成资源泄漏。只有当基类析构函数为虚函数时，才会先调用派生类析构函数再调用基类析构函数。故「一定会先调用 Derived 的析构函数」不成立。" },
    { id: "2606-18", section: "判断题", number: 18, stem: "第 3 题 在 C++ STL 中，stack 的 pop() 函数会返回栈顶元素并将其删除。", options: [], answer: "", knowledge: "栈、队列与循环队列", analysis: "本题判断为错误。C++ STL 中 std::stack 的 pop() 成员函数返回类型为 void，仅将栈顶元素弹出并删除，并不返回该元素；若要获取栈顶元素需先调用 top() 再 pop()。" },
    { id: "2606-19", section: "判断题", number: 19, stem: "第 4 题 程序运行后会输出 2。\nint main() {\n    queue<int> q;\n    q.push(1);\n    q.push(2);\n    q.push(3);\n    q.pop();\n    cout << q.front() << endl;\n    return 0;\n}", options: [], answer: "", knowledge: "栈、队列与循环队列", analysis: "本题判断为正确。queue 依次 push 1、2、3，队首为 1；q.pop() 弹出队首 1 后，新的队首为 2；cout << q.front() 输出 2，与题意相符。" },
    { id: "2606-20", section: "判断题", number: 20, stem: "第 5 题 下列函数试图将整数 x 插入到一棵二叉搜索树中。假设二叉搜索树满足如下性质：对于任意结点，左子树中所有结点的值均小于该结点的值，右子树中所有结点的值均大于或等于该结点的值。判断该函数是否能够在插入后保持二叉搜索树性质。\nTreeNode* insertNode(TreeNode* root, int x) {\n    if (root == nullptr) { return new TreeNode(x); }\n    if (x < root->val) {\n        root->right = insertNode(root->right, x);\n    } else {\n        root->left = insertNode(root->left, x);\n    }\n    return root;\n}", options: [], answer: "", knowledge: "二叉排序树与二叉树搜索", analysis: "本题判断为错误。该函数插入逻辑写反：当 x < root->val 时本应插入左子树，却执行 root->right = insertNode(root->right, x)；否则本应插入右子树却执行 root->left = insertNode(root->left, x)。这样会把较小值放入右子树、较大值放入左子树，破坏二叉搜索树「左子树均小于根、右子树均大于等于根」的性质，插入后不能保持 BST 性质。" },
    { id: "2606-21", section: "判断题", number: 21, stem: "第 6 题 哈夫曼编码一定唯一，只要字符频率相同，得到的编码也一定完全相同。", options: [], answer: "", knowledge: "哈夫曼树与哈夫曼编码", analysis: "本题判断为错误。哈夫曼编码并不唯一。相同字符频率下，合并两个最小权值结点时若存在权值相同的多个候选，不同的合并顺序会产生不同的编码方案（编码长度与 WPL 相同，但具体编码位串可不同）。因此频率相同不保证编码完全相同。" },
    { id: "2606-22", section: "判断题", number: 22, stem: "第 7 题 若用数组按层序存储完全二叉树，且根节点下标为 0，则下标为 i 的节点左孩子下标为 2 * i + 1，右孩子下标为 2 * i + 2。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。完全二叉树按层序从 0 开始编号存储于数组时，下标 i 结点的左、右孩子分别位于 2*i+1 与 2*i+2；反之父结点为 (i-1)/2。这是堆（数组实现完全二叉树）的标准下标关系。" },
    { id: "2606-23", section: "判断题", number: 23, stem: "第 8 题 以下代码可以正确地按层换行输出二叉树的节点值。\nvoid printByLevel(TreeNode* root) {\n    if (!root) return;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        for (int i = 0; i < q.size(); ++i) {\n            TreeNode* cur = q.front();\n            q.pop();\n            cout << cur->val << \" \";\n            if (cur->left) q.push(cur->left);\n            if (cur->right) q.push(cur->right);\n        }\n        cout << endl;\n    }\n}", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为错误。该函数意图按层换行输出，但内层 for 循环的循环条件写成了 i < q.size() 而非先用 int sz = q.size() 固定本层结点数。由于在循环体内向队列压入子结点会使 q.size() 动态增大，导致一层尚未处理完就混入下一层结点，换行位置错乱，不能正确按层换行输出。" },
    { id: "2606-24", section: "判断题", number: 24, stem: "第 9 题 使用栈非递归实现二叉树前序遍历时，若希望先访问左子树，通常应先将右孩子入栈，再将左孩子入栈。", options: [], answer: "", knowledge: "树与二叉树基础", analysis: "本题判断为正确。用栈非递归实现前序遍历（根-左-右），由于栈是后进先出，要让左子树先于右子树被访问，应先压入右孩子、再压入左孩子，使左孩子在栈顶先被弹出处理。描述正确。" },
    { id: "2606-25", section: "判断题", number: 25, stem: "第 10 题 动态规划问题通常要求具有最优子结构，并且常常存在重叠子问题。", options: [], answer: "", knowledge: "简单动态规划", analysis: "本题判断为正确。动态规划适用问题通常具有最优子结构（全局最优包含子问题最优）与重叠子问题（同一子问题被重复计算，可用记忆化/DP 表避免），这是 DP 的两大基本要素。" },

    { id: "2606-26", section: "编程题", number: 26, stem: "试题名称：条形蛋糕。\n给定一条长度为 n 的长条蛋糕和一个价格表，其中长度为 i（1<=i<=n）的蛋糕块售价为 p[i]。求将蛋糕分割成若干整数长度块后的最大总销售价格（蛋糕块长度必须为整数）。\n输入格式：第一行一个正整数 n（1<=n<=1000）；第二行 n 个正整数 p[1]..p[n]（1<=p[i]<=10000），依次为长度 1 到 n 的蛋糕块价格。\n输出格式：一行一个正整数，表示最大总销售价格。\n输入样例 1：\n4\n1 5 8 9\n输出样例 1：\n10\n（切成两段长度为 2 的蛋糕，5+5=10）\n输入样例 2：\n10\n1 5 8 9 10 17 17 20 24 30\n输出样例 2：\n30", options: [], answer: "", knowledge: "简单动态规划", referenceCode: "#include <iostream>\nusing namespace std;\nint dp[1010], p[1010];\nint main() {\n    int n;\n    cin >> n;\n    for (int i = 1; i <= n; ++i)\n        cin >> p[i];\n    for (int i = 1; i <= n; ++i) {\n        for (int j = i; j <= n; ++j) {\n            dp[j] = max(dp[j], dp[j - i] + p[i]);\n        }\n    }\n    cout << dp[n] << endl;\n    return 0;\n}", analysis: "本题为经典「切木棍 / rod cutting」动态规划。状态 dp[j] 表示长度为 j 的蛋糕能卖出的最大价格。枚举最后切下的一块长度 i（1<=i<=n），则 dp[j] = max(dp[j], dp[j-i]+p[i])，即「不切下长度 i 的块」与「切下一块长度 i（得价 p[i]，剩下长度 j-i 递归处理）」取较大。参考程序外层 i 枚举块长、内层 j 从 i 到 n 更新，最终 dp[n] 即为答案。时间复杂度 O(n^2)。" },
    { id: "2606-27", section: "编程题", number: 27, stem: "试题名称：满二叉树。\n给定一棵包含 n 个结点的有根二叉树，结点以 1..n 编号，根结点编号为 1。对结点 i，其左、右儿子编号分别为 l[i]、r[i]；儿子不存在时对应值为 0。每个结点对应以其为根的一棵子树。求所有 n 棵子树中有多少棵是满二叉树（所有叶子深度相同，且除叶子外每个结点都有两个儿子）。\n输入格式：第一行一个正整数 n；接下来 n 行，每行两个非负整数 l[i]、r[i]。\n输出格式：一行一个整数，表示满二叉树子树的数量。\n输入样例 1：\n4\n2 3\n4 0\n0 0\n0 0\n输出样例 1：\n2\n输入样例 2：\n3\n2 3\n0 0\n0 0\n输出样例 2：\n3", options: [], answer: "", knowledge: "深度优先搜索", referenceCode: "#include <iostream>\n#include <algorithm>\nusing namespace std;\nint n;\nint l[100010], r[100010];\nint h[100010], chk[100010] = {1};\nint ans;\nvoid dfs(int u) {\n    if (!u)\n        return;\n    dfs(l[u]);\n    dfs(r[u]);\n    h[u] = max(h[l[u]], h[r[u]]) + 1;\n    chk[u] = chk[l[u]] && chk[r[u]] && (h[l[u]] == h[r[u]]);\n    ans += chk[u];\n}\nint main() {\n    cin >> n;\n    for (int i = 1; i <= n; i++)\n        cin >> l[i] >> r[i];\n    ans = 0;\n    dfs(1);\n    cout << ans << endl;\n    return 0;\n}", analysis: "对每棵子树用 DFS（后序）统计：h[u] 为以 u 为根的子树高度；chk[u] 表示该子树是否为满二叉树，需满足左右子树均为满二叉树且高度相等（即左右子树同高且都满，则 u 也满）。叶子结点（左右儿子均为 0）高度为 1、chk 为真，计入答案。累加所有 chk[u] 即为满二叉树子树总数。时间复杂度 O(n)。" }
  ]
};

"计算机基础知识": `
<h3>一、计算机网络基础：为什么要先学网络？</h3>
<p>进入 GESP 六级，计算机网络常识首次成为必考内容。真题以<b>传输层协议</b>、<b>网络拓扑</b>和<b>移动通信代际</b>三类题为主，难度不大但需要记住几个核心结论：互联网使用的核心协议族是 TCP/IP 协议族，整个协议族分为四层——应用层、传输层、网络层、网络接口层；我们平时说的"打开网页""发邮件"在应用层，"三次握手""可靠传输"在传输层。</p>
<h3>二、传输层两大协议：TCP 与 UDP</h3>
<p><b>TCP（Transmission Control Protocol，传输控制协议）</b>和<b>UDP（User Datagram Protocol，用户数据报协议）</b>并列处于 TCP/IP 协议族的传输层，两者提供两种完全不同的服务，常被同时考查对比：</p>
<table>
<tr><th>对比项</th><th>TCP</th><th>UDP</th></tr>
<tr><td>是否面向连接</td><td>面向连接（三次握手建立连接、四次挥手断开连接）</td><td>无连接，发完即走</td></tr>
<tr><td>可靠性</td><td>可靠：超时重传、确认应答、按序到达、不丢不重</td><td>尽力交付：可能丢包、乱序、重复</td></tr>
<tr><td>流量与拥塞控制</td><td>有滑动窗口、拥塞控制机制</td><td>无控制，发多少是多少</td></tr>
<tr><td>传输速度与开销</td><td>开销大、速度慢、首部 20 字节</td><td>开销小、速度快、首部仅 8 字节</td></tr>
<tr><td>典型应用</td><td>网页浏览（HTTP）、文件传输（FTP）、收发邮件（SMTP）</td><td>视频直播、语音通话、域名查询（DNS）</td></tr>
</table>
<p><b>真题陷阱：</b>"TCP/IP 的传输层的两个不同的协议分别是 UDP 和 TCP"是<b>正确</b>判断；"UDP 一无是处，所以淘汰"是<b>错误</b>说法——实时性要求高的场景（直播、语音）反而选 UDP；"TCP 一定比 UDP 好"也错——好坏取决于场景。</p>
<h3>三、移动通信代际中的"G"</h3>
<p>1G、2G、3G、4G、5G 中的字母 G 是英文单词 <b>Generation（第几代）</b>的简写，表示第几代移动通信技术：1G 模拟语音、2G 数字短信、3G 移动互联网、4G 视频时代、5G 万物互联。注意 G 不是 Gigabytes（每秒多少 GB），真题中把 G 解释为数据传输单位是<b>错误</b>判断。</p>
<h3>四、输入设备与输出设备的辨析</h3>
<p>判断一个设备属于输入还是输出，标准是<b>信息流动方向</b>：从人/外部世界送往计算机的是输入设备，从计算机送往人/外部世界的是输出设备。</p>
<ul>
<li><b>常见输入设备：</b>键盘、鼠标、麦克风、摄像头、扫描仪、手写板、触摸屏（接收触控信号）、条码扫描枪、各类传感器；</li>
<li><b>常见输出设备：</b>显示器、音箱、耳机、打印机、投影仪、绘图仪；</li>
<li><b>既输入又输出：</b>触摸屏（接收手指位置、显示画面）、可穿戴设备上的小屏；</li>
</ul>
<p>真题考点"手写板属于输入设备"——手写板把人写的笔迹传给计算机，属于输入设备。容易混淆的"打印机"是输出设备，"扫描仪"是输入设备。</p>
<h3>五、算法复杂度：大 O 记号的等级</h3>
<p>评价一个算法快慢，不能只看执行时间（受机器、编程语言影响），而要看<b>数据规模 n 增长时运算次数的增长趋势</b>，这就是大 O 记号，表示运算次数的量级。常见等级按增长快慢排列：</p>
<pre>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2ⁿ) &lt; O(n!)</pre>
<ul>
<li><b>O(1)</b>——常数时间，与 n 无关（如数组按下标访问）；</li>
<li><b>O(log n)</b>——对数级（二分查找、平衡 BST 查找）；</li>
<li><b>O(n)</b>——线性（数组遍历、链表查找、树的遍历）；</li>
<li><b>O(n log n)</b>——线性对数（归并排序、快速排序平均）；</li>
<li><b>O(n²)</b>——平方级（双重循环、选择/冒泡/插入排序、某些 DP）；</li>
<li><b>O(2ⁿ)</b>——指数级（暴力枚举所有子集）；</li>
</ul>
<p>六级真题频繁出现"平均时间复杂度"选择，需要把具体算法对应到量级：哈希查找平均 O(1)，二叉搜索树平均 O(log n) 最坏 O(n)，链表查找 O(n)，归并排序 O(n log n)，DFS/BFS 遍历 O(n+e)。</p>
<h3>六、典型真题精讲</h3>
<p><b>真题 1（2309 单选第 1 题）：</b>"在 TCP/IP 协议体系中，传输层有两个不同的协议，分别是？"<br>解析：TCP/IP 协议族中传输层的两个核心协议是 <b>TCP</b> 和 <b>UDP</b>，两者并列存在，对应答案选 A。其他选项或缺少协议、或混淆应用层（HTTP/SMTP）与传输层协议。</p>
<p><b>真题 2（2309 判断第 2 题）：</b>"5G 中的 G 表示每秒传输的千兆字节数（GB）。"<br>解析：错误。G 表示 Generation"第几代"，是技术代际而非单位，1G/2G/3G/4G/5G 表示第一代到第五代移动通信。</p>
<p><b>真题 3（2309 单选第 1 题衍生）：</b>"下列设备中属于输入设备的是？"<br>解析：手写板、键盘、麦克风都是输入设备；显示器、打印机、音箱是输出设备；触摸屏兼具输入输出两种属性。</p>
<h3>七、易错点对比小结</h3>
<ul>
<li><b>TCP≠UDP 包含关系</b>：两者并列，不是包含；</li>
<li><b>5G 的 G 是 Generation 不是 Gigabytes</b>；</li>
<li><b>手写板是输入设备</b>，打印机是输出设备；</li>
<li><b>复杂度量级排序</b>：O(1) 最快、O(2ⁿ) 最慢，常考排序细节；</li>
<li><b>遍历类算法（DFS/BFS/树遍历）复杂度都是 O(n+e) 或 O(n)</b>，看选项别被"深度""广度"字眼迷惑。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>"TCP/IP 的传输层的两个不同的协议分别是 UDP 和 TCP"——这句话是<b>正确</b>的，两者确实是并列关系，不是包含关系。TCP 保证可靠，UDP 不保证，但"UDP 一无是处"是错的说法：实时性要求高的场景反而要用 UDP。"5G 的 G 是 Generation 不是 GB"、"手写板是输入不是输出"、"对数快于线性、线性快于平方"也是反复出现的高频记忆点。</div>

"面向对象与类": `
<h3>一、什么是面向对象？为什么要面向对象？</h3>
<p>面向对象程序设计（Object-Oriented Programming，OOP）是一种把<b>数据</b>和<b>操作数据的方法</b>捆绑成一个整体——<b>类（Class）</b>——来模拟现实事物和它们之间关系的程序设计思想。它解决了传统面向过程编程中数据与方法分离、难以管理复杂系统的问题，使程序更易于理解、复用和维护。真题中常考的三大特性是<b>封装、继承、多态</b>，缺一不可。</p>
<h3>二、面向对象三大特性详解</h3>
<ul>
<li><b>封装（Encapsulation）：</b>把数据和操作藏进类内部，对外只暴露必要的<b>接口</b>（public 成员函数）。外部代码不能直接修改内部细节，必须通过公开方法。C++ 中用 <code>private</code>、<code>protected</code>、<code>public</code> 三种访问权限来实现；</li>
<li><b>继承（Inheritance）：</b>已有类（父类/基类）派生出新类（子类/派生类），子类自动获得父类的属性和行为，可重用代码并表达"is-a"关系（如"圆是形状的一种"）。单继承一个父类、多继承多个父类；</li>
<li><b>多态（Polymorphism）：</b>同一操作作用于不同对象产生不同行为。父类指针/引用指向子类对象时，调用的同名函数自动切换到子类的版本——C++ 通过<b>虚函数（virtual）</b>和<b>动态绑定</b>实现。</li>
</ul>
<h3>三、类与对象的关系</h3>
<p><b>类是模板（图纸），对象是实例（产品）。</b>定义类就像画一张图纸，描述这种对象"长什么样、做什么事"；创建对象就像照图纸造一件具体产品。真题判断题"对象是类的实例"是<b>正确</b>，"类是对象的实例"是<b>错误</b>，主谓顺序反了就是错。C++、Java、Python、PHP 都是面向对象语言，而<b>C 语言不是</b>（它是面向过程的语言）。</p>
<h3>四、类的创建与成员</h3>
<p>用 <code>class</code> 关键字创建类，<b>成员默认私有（private）</b>。通常把数据设为 private 隐藏起来，把函数设为 public 提供对外接口：</p>
<pre>class MyStr {
private:                        // 私有成员：仅类内访问
    string data;
public:                         // 公有成员：外部可访问
    MyStr(string s) {           // 构造函数：与类同名、无返回类型
        data = s;
    }
    string get() {              // 公有成员函数（对外的接口）
        return data;
    }
    ~MyStr() {}                 // 析构函数：~类名，对象销毁时自动调用
};

MyStr st("ABC");                // 创建对象（实例化），自动调用构造函数
cout &lt;&lt; st.get();               // 通过公有接口访问，输出 ABC
// cout &lt;&lt; st.data;             // 错误！data 是私有成员，类外不可访问</pre>
<h3>五、构造函数与析构函数</h3>
<ul>
<li><b>构造函数：</b>与类同名、无返回类型，对象创建时自动执行。可以重载多个，给不同的参数组合提供不同的初始化方式。不写时编译器生成一个默认构造函数（无参）。</li>
<li><b>析构函数：</b>名字是 ~类名，无返回类型无参数，对象销毁时自动执行，负责释放资源。析构顺序与构造顺序相反——后构造的先析构。</li>
<li><b>带单参数的构造函数支持隐式类型转换：</b><code>MyStr st = "ABC";</code> 自动调用 <code>MyStr(string s)</code>。用 <code>explicit</code> 关键字可禁止这种隐式转换（防止意外的类型转换）。</li>
<li><b>静态全局对象和常量全局对象在 main 之前完成初始化、main 结束后被析构；</b>类 A 的对象 a 若是类 B 的静态成员，a 也在 main 之前初始化（静态成员先于任何对象创建）。</li>
</ul>
<h3>六、static 与 const 成员</h3>
<ul>
<li><b>static 静态成员：</b>属于整个类，<b>被所有对象共享</b>，只有一份拷贝。静态成员变量需在类外单独初始化（<code>int MyClass::count = 0;</code>）；</li>
<li><b>整型常量静态成员的特殊规则：</b>可以在类内直接初始化（<code>static const int MAX = 100;</code>）；因此判断题"所有常量静态变量都只能在类外初始化"是<b>错误</b>说法；</li>
<li><b>const 对象：</b>只能调用以 const 修饰的成员函数（保证不修改对象状态）；非 const 对象可以调用 const 函数也可以调用非 const 函数；</li>
<li><b>static 函数：</b>没有 this 指针，只能访问静态成员。</li>
</ul>
<h3>七、运算符重载</h3>
<p>C++ 允许为自定义类重载 <code>+</code>、<code>&lt;&lt;</code>、<code>==</code> 等运算符，让类对象支持直观的运算：</p>
<pre>class Vec {
public:
    int x, y;
    Vec(int a, int b) : x(a), y(b) {}
    Vec operator+(const Vec&amp; o) const {     // 重载 +
        return Vec(x + o.x, y + o.y);
    }
    friend ostream&amp; operator&lt;&lt;(ostream&amp; os, const Vec&amp; v) {
        return os &lt;&lt; "(" &lt;&lt; v.x &lt;&lt; "," &lt;&lt; v.y &lt;&lt; ")";  // 重载 &lt;&lt;
    }
};
Vec a(1,2), b(3,4);
cout &lt;&lt; a + b;        // 输出 (4,6)</pre>
<p><b>关键：</b>没为自定义类重载 <code>&lt;&lt;</code> 时，<code>cout &lt;&lt; 对象</code> 会<b>编译错误</b>（类型不匹配），不是运行错误。</p>
<h3>八、命名空间 namespace</h3>
<p>命名空间用来给名字"分家"，防止不同模块的同名函数/变量冲突。</p>
<ul>
<li>可以嵌套定义（<code>namespace A { namespace B {...} }</code>）；</li>
<li>可以放变量、函数、类、结构体；</li>
<li>可以在全局定义，也可以在函数内定义（局部命名空间）；</li>
<li>用 <code>using namespace A;</code> 引入命名空间全部成员，或 <code>using A::func;</code> 引入单个成员；</li>
<li>多个命名空间<b>同名函数</b>同时被引入时（<code>using namespace A; using namespace B;</code> 且 A、B 都有同名函数），调用该函数会出现<b>二义性，编译错误</b>——不是"运行错误"，真题考过这个细节辨析。</li>
</ul>
<h3>九、典型真题精讲</h3>
<p><b>真题 1（2309 单选第 3 题）：</b>"下列关于类和对象的说法正确的是？"<br>A. 类是对象的实例　B. 对象是类的模板　C. 类是对象的抽象，对象是类的实例　D. 类和对象没有任何区别<br>解析：答案是 C。"对象是类的实例"是正确的表述；A 颠倒了主语，B 把"模板"给了对象不对，D 完全错误。</p>
<p><b>真题 2（2309 判断第 4 题）：</b>"static 成员被类的所有对象共享。"<br>解析：正确。static 成员属于类本身而非某个对象，所有对象共用一份拷贝。</p>
<p><b>真题 3（2406 判断题）：</b>"命名空间内出现同名函数时一定产生运行错误。"<br>解析：错误。是编译期二义性错误，编译阶段就通不过，不会进入运行阶段。</p>
<h3>十、易错点对比小结</h3>
<ul>
<li>对象是类的实例，别把主语说反；</li>
<li>C 不是面向对象语言（Python、C++、Java 是）；</li>
<li>私有成员类外不可访问，<code>cout &lt;&lt; obj.data</code> 编译错误；</li>
<li><code>cout &lt;&lt; 自定义类对象</code> 需先重载 <code>&lt;&lt;</code>，否则编译错误；</li>
<li>同名冲突是编译期二义性错误，不是运行错误；</li>
<li>静态成员被所有对象共享，类外初始化（整型常量除外可在类内初始化）；</li>
<li>构造函数与类同名无返回类型；析构函数为 ~类名无返回类型无参数；</li>
<li>析构顺序与构造顺序相反。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 对象是类的实例，别把主语说反；(2) C 不是面向对象语言；(3) 私有成员类外不可访问；(4) cout 输出自定义类对象需先重载 &lt;&lt;；(5) 同名冲突是编译期二义性错误，不是运行错误；(6) 静态成员被所有对象共享；(7) 析构顺序与构造顺序相反；(8) 整型常量静态成员可在类内初始化（不可一概说"只能在类外"）。</div>

<h3>一、为什么先学线性数据结构？</h3>
<p>栈、队列、循环队列是程序设计中最基础也是最高频考查的线性数据结构。它们的逻辑结构非常简单——元素排成一列，按特定规则增删——但实现细节（边界条件、内存布局）恰好是六级判断题和编程题的常考点。本节按"逻辑 → 实现 → 典型应用 → 易错点"四步讲清三者的关系。</p>
<h3>二、栈（Stack）：后进先出的羽毛球筒</h3>
<p><b>栈（Stack）</b>是只允许在一端进行插入和删除的线性表，遵循 <b>LIFO（Last In First Out，后进先出）</b>原则：最后被压入（push）的元素最先被弹出（pop）。典型比喻是装羽毛球的筒——只能从顶口放、取球，最后放进去的在最上面，最先取出。</p>
<ul>
<li><b>核心操作：</b>push（入栈/压栈，把元素压入栈顶）、pop（出栈/弹栈，弹出栈顶元素）、top/peek（查看栈顶元素但不弹出）；</li>
<li><b>边界条件：</b>栈空时执行 pop 会下溢（出错）；栈满时执行 push 会上溢（数组实现会越界，链表实现通常不会）；</li>
<li><b>典型应用：</b>函数调用栈、括号匹配、表达式求值、浏览器"后退"按钮、DFS 递归转非递归、进制转换；</li>
</ul>
<pre>// 用数组模拟栈（top 指向栈顶元素的下标）
int stk[100], top = -1;              // 初始化为空栈
stk[++top] = 3;                       // push 3
stk[++top] = 5;                       // push 5
int x = stk[top--];                   // pop，返回栈顶 5
// top 当前指向新栈顶元素 3</pre>
<h3>三、队列（Queue）：先进先出的排队买票</h3>
<p><b>队列（Queue）</b>是只允许在一端（队尾 rear）插入、另一端（队头 front）删除的线性表，遵循 <b>FIFO（First In First Out，先进先出）</b>原则：最先入队的最先出队。典型比喻是排队买票——新来的人排到队尾，先到的人从队头离开。</p>
<ul>
<li><b>核心操作：</b>enqueue/push（入队，把元素加到队尾）、dequeue/pop（出队，删除队头元素）、front（查看队头）、rear/back（查看队尾）；</li>
<li><b>典型应用：</b>打印任务排队、BFS 宽度优先搜索、消息缓冲、操作系统进程调度；</li>
</ul>
<pre>// 用数组模拟队列（head 指向队头，tail 指向队尾的下一个位置）
int q[100], head = 0, tail = 0;
q[tail++] = 5;                        // 入队
q[tail++] = 8;                        // 入队
int x = q[head++];                    // 出队，返回队头 5
// head=1, tail=2，剩余 [8]</pre>
<h3>四、循环队列：解决数组队列的"假溢出"</h3>
<p>用数组实现普通队列时，不断出队后队头前面的格子就"空着"但用不上了——这就是<b>假溢出</b>。把数组首尾逻辑上接成一个环，下标用取余运算实现循环，这就是<b>循环队列（Circular Queue）</b>。</p>
<pre>// 循环队列核心操作
const int N = 100;                    // 数组大小
int q[N], head = 0, tail = 0;
q[tail] = x; tail = (tail + 1) % N;   // 入队
int x = q[head]; head = (head + 1) % N;  // 出队</pre>
<p><b>核心问题：如何区分"队列为空"和"队列为满"？</b>两种标准方案：</p>
<table>
<tr><th>方案</th><th>判空条件</th><th>判满条件</th><th>代价</th></tr>
<tr><td>牺牲一个格子</td><td>front == rear</td><td>(rear + 1) % N == front</td><td>最多存 N-1 个元素，浪费 1 格</td></tr>
<tr><td>计数器计数</td><td>cnt == 0</td><td>cnt == N</td><td>需额外维护一个 int 变量</td></tr>
<tr><td>布尔标志位</td><td>front == rear &amp;&amp; !full</td><td>front == rear &amp;&amp; full</td><td>需维护标志</td></tr>
</table>
<p><b>真题高频陷阱：</b>"判空"和"判满"如果都用 <code>front == rear</code> 一个条件，根本分不清空和满——这正是要"牺牲一个格子"或"加计数器"的原因。循环队列判满公式是 <b>(rear + 1) % N == front</b>，千万别写成 <code>rear + 1 == front</code>（没取余、可能越界）。</p>
<h3>五、栈和队列的互相实现</h3>
<p>两个栈能模拟一个队列（负负得正，两次 LIFO 变成 FIFO）：入队时压入栈 A；出队时若栈 B 非空则弹出 B 的栈顶（这是最先入队的元素），否则把 A 全部弹出压入 B 再弹。一个队列也能模拟栈但代价更高（需要两个队列）。<b>双端队列（deque）</b>两端都能进出，兼具栈和队列特性。</p>
<h3>六、典型真题精讲</h3>
<p><b>真题 1（2406 单选）：</b>"下列关于栈的说法错误的是？"<br>A. 栈是后进先出结构　B. 栈顶元素先被弹出　C. 栈可以使用数组或链表实现　D. 栈的插入和删除操作可以在任意位置进行<br>解析：答案是 D。栈只允许在栈顶进行插入和删除，不允许在任意位置操作，所以 D 错误。</p>
<p><b>真题 2（2309 判断题）：</b>"循环队列一定比普通队列快。"<br>解析：错误。两者单次操作的时间复杂度都是 O(1)，循环队列只是把数组首尾逻辑连接起来解决了"假溢出"问题，本质上没有"更快"。</p>
<p><b>真题 3（2506 编程题相关）：</b>"用 N 个格子的循环队列，最多能存多少个元素？"（牺牲一格方案）<br>解析：最多存 N-1 个元素（留 1 格区分空和满）。如果用计数器方案则能存满 N 个元素，但需额外维护计数器变量。</p>
<h3>七、易错点对比小结</h3>
<ul>
<li>栈后进先出（LIFO）、队列先进先出（FIFO），别记反；</li>
<li>栈用栈顶操作、队列两头各管一边；</li>
<li>循环队列牺牲一格时判满是 <code>(rear + 1) % N == front</code>，别忘取余；</li>
<li>判空和判满不能只用 <code>front == rear</code> 一个条件——分不开；</li>
<li>栈和队列都可以用数组或链表实现（没有"只能用指针实现"的限制）；</li>
<li>循环队列只是解决假溢出，单次操作时间复杂度仍是 O(1)，并不"更快"。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>循环队列牺牲一格时，判满条件是 <b>(rear+1)%N == front</b>，千万别写成 rear+1 == front（没取余，越界就错）；判空和判满不能只用 front == rear 一个条件区分，否则"空"和"满"长得一样分不清——这正是要牺牲一格或加计数器的原因。真题还考过：栈和队列都可以用数组或链表实现；"循环队列一定更快"是错误说法；"判空=判满"会分不清状态。</div>

"链表": `
<h3>一、什么是链表？为什么要学链表？</h3>
<p>前面讲的栈和队列可以用数组或链表实现。本节专门看<b>链表</b>：它是动态数据结构的核心，考察频率仅次于栈队列。链表由一个个<b>结点（Node）</b>通过指针串联而成，不要求物理上连续存放，特别适合频繁插入/删除、规模动态变化的场景。</p>
<h3>二、链表的基本结构与操作</h3>
<p>每个结点包含<b>数据域</b>和<b>指针域</b>两部分：</p>
<pre>struct Node {
    int data;              // 数据域：存放元素值
    Node* next;            // 指针域：指向下一个结点
};
Node* head = NULL;         // 头指针：指向链表的第一个结点
Node* p = new Node;
p-&gt;data = 5; p-&gt;next = NULL;
head = p;                  // 头插法</pre>
<p>链表的核心操作：</p>
<ul>
<li><b>创建结点：</b>用 <code>new</code> 申请内存，填好数据和 next 指针；</li>
<li><b>遍历：</b>从 head 开始，<code>p = p-&gt;next</code> 一个一个走，直到 <code>p == NULL</code>；</li>
<li><b>插入：</b>找到位置后，把新结点的 next 指向后继、把前驱的 next 指向新结点。常用"先接后面再接前面"避免断链；</li>
<li><b>删除：</b>找到前驱，把前驱的 next 直接跳过要删的结点指向下下个，<b>先保存 next 再 free</b>，否则 free 后找不到下一个；</li>
</ul>
<h3>三、数组 vs 链表的对比</h3>
<table>
<tr><th>操作</th><th>数组</th><th>链表</th></tr>
<tr><td>按下标访问第 i 个元素</td><td>O(1) 随机访问，快</td><td>O(n) 必须从头顺着走</td></tr>
<tr><td>在中间插入/删除</td><td>O(n) 要整体挪动后续元素</td><td>O(1) 改指针即可（先定位）</td></tr>
<tr><td>内存布局</td><td>连续存放</td><td>散落各处，靠指针串接</td></tr>
<tr><td>空间开销</td><td>无额外开销</td><td>每个结点多一个指针</td></tr>
<tr><td>适合场景</td><td>查找多、增删少</td><td>增删多、查找少</td></tr>
</table>
<h3>四、链表的种类</h3>
<ul>
<li><b>单链表：</b>每个结点只有一个 next 指针，只能单向遍历、不能回头。最简单、最常用；</li>
<li><b>双向链表：</b>每个结点有 prev 和 next 两个指针，可以向前走也可以向后走。删除更方便（不用找前驱）；</li>
<li><b>循环链表：</b>尾结点的 next 不是 NULL 而是指回头结点，整个链表形成一个环。可以从任意结点出发遍历所有结点；</li>
<li><b>双向循环链表：</b>既是双向又是循环。真题考过"n 个结点的双向循环链表查找某结点的平均时间复杂度"——仍要从某个结点出发逐个比较，<b>平均 O(n)</b>，循环结构并不能加速查找；</li>
<li><b>带头结点的链表：</b>在第一个数据结点之前再加一个"头结点"（不存数据），统一了"头部插入"和"中间插入"的处理逻辑，代码更简洁。</li>
</ul>
<h3>五、数组模拟链表</h3>
<p>很多人以为链表"必须"用指针实现——这是<b>错误</b>的。竞赛中常用<b>两个数组</b>模拟链表：</p>
<pre>int data[100];                // 存数据
int nxt[100];                  // 存"下一个下标"，初始为 -1（表示 NULL）
int head = -1, cnt = 0;        // head 是头结点下标，cnt 是当前用到的格子数

void push_front(int v) {       // 头插
    data[cnt] = v;
    nxt[cnt] = head;
    head = cnt++;
}
void traverse() {              // 遍历
    for (int p = head; p != -1; p = nxt[p])
        cout &lt;&lt; data[p] &lt;&lt; " ";
}</pre>
<p>数组模拟链表避免了 <code>new/delete</code>，速度更快、不怕内存泄漏，是 OI 常用技巧。这也证明判断题"链表只能用指针实现"是<b>错误</b>。</p>
<h3>六、典型真题精讲</h3>
<p><b>真题 1（2309 判断题）：</b>"链表在 C/C++ 中只能用指针实现。"<br>解析：错误。用两个数组（一个存数据、一个存"下一个下标"）同样能模拟链表。指针是实现链表的"一种常用方式"但不是唯一方式，"只能""必须"这类绝对化措辞多半是陷阱。</p>
<p><b>真题 2（2409 单选）：</b>"n 个结点的双向循环链表查找某结点的平均时间复杂度是？"<br>A. O(1)　B. O(log n)　C. O(n)　D. O(n²)<br>解析：答案是 C。虽然双向循环链表可以双向走，但查找特定值仍要逐个比较，循环结构并不提供随机访问，平均仍是 O(n)。</p>
<p><b>真题 3（2412 单选）：</b>"在单链表中，在某个已知结点 p 之后插入一个新结点的时间复杂度是？"<br>A. O(1)　B. O(n)　C. O(log n)　D. O(n²)<br>解析：答案是 A。已经知道 p 的位置，只需 <code>new-&gt;next = p-&gt;next; p-&gt;next = new;</code> 即可，常数时间。如果是在"按值查找的位置之后插入"则要先 O(n) 定位。</p>
<h3>七、易错点对比小结</h3>
<ul>
<li>链表查找（无论单向、双向、循环）平均都是 <b>O(n)</b>，因为不能随机访问；</li>
<li>"只能用指针实现链表"是错的，数组模拟链表完全合法；</li>
<li>删除结点时先保存 next 指针再 free，否则 free 后找不到下一个而断链；</li>
<li>数组擅长"找"，链表擅长"插删"；</li>
<li>双向循环链表并不能让查找变快；</li>
<li>带头结点的链表并不存数据，只是为了代码简洁统一。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) 链表查找（无论单向、双向、循环）平均都是 O(n)，因为不能随机访问；(2) "只能用指针实现链表"是错的；(3) 删除结点时先保存 next 指针再 free，否则断链；(4) 数组擅长"找"，链表擅长"插删"；(5) 双向循环链表查找仍是 O(n)，不能因为"双向"或"循环"就以为是 O(1) 或 O(log n)；(6) 在已知结点后插入新结点是 O(1)，在已知位置前插入仍要 O(n) 找前驱。</div>

"树与二叉树基础": `
<h3>一、什么是树？为什么要学树？</h3>
<p>树是数据结构中最重要的非线性结构之一，它模拟了现实世界的层次关系（家谱、组织架构、文件系统目录）。在 GESP 六级真题中，树的题量是所有知识点中最大的——遍历、性质、BST、堆、哈夫曼、平衡等都建立在"树"的概念之上。本节先夯实树的定义和术语，再深入二叉树。</p>
<h3>二、树的定义与术语</h3>
<p><b>树</b>是 n（n ≥ 0）个结点的有限集合（n = 0 称为空树）。当 n &gt; 0 时，有且仅有一个<b>根结点</b>（root），其余结点分成若干个互不相交的子树。像家谱：祖先在上、子孙在下，分支不能成环。<b>n 个结点的树恰好有 n - 1 条边</b>（每个非根结点都有一条连向父亲的边）。</p>
<ul>
<li><b>结点的度：</b>该结点拥有的子树个数（孩子个数）；</li>
<li><b>树的度：</b>所有结点度的最大值；</li>
<li><b>叶子结点（终端结点）：</b>度为 0 的结点（没有孩子）；</li>
<li><b>分支结点（非终端结点）：</b>度不为 0 的结点；</li>
<li><b>孩子 / 双亲 / 兄弟：</b>结点的子树根是它的孩子；该结点是它们的双亲；同一双亲的孩子互为兄弟；</li>
<li><b>深度（高度）：</b>从根到该结点的路径长度（根的深度为 1）；结点的层数；</li>
<li><b>树的高度：</b>所有结点深度的最大值（叶子结点的最大深度）；</li>
<li><b>森林：</b>互不相交的若干棵树的集合。</li>
</ul>
<h3>三、二叉树的定义与性质</h3>
<p><b>二叉树</b>是每个结点至多有两棵子树（左子树、右子树）的有序树，且<b>左、右子树有顺序</b>（左右互换就是另一棵树）。它与"度为 2 的树"不同：二叉树允许只有左孩子或只有右孩子，还可以是空的。两条必背性质：</p>
<ul>
<li><b>性质 1：</b>第 i 层最多有 <b>2^(i-1)</b> 个结点（i ≥ 1）；深度为 k 的二叉树最多有 <b>2^k - 1</b> 个结点；</li>
<li><b>性质 2：</b>任何二叉树中，<b>叶子结点数 n₀ 与度为 2 的结点数 n₂ 满足 n₀ = n₂ + 1</b>。这是真题反复考、必须记牢的结论。利用它可由叶子数反推总结点数：n = n₀ + n₁ + n₂ = 2n₀ + n₁ - 1。</li>
</ul>
<h3>四、满二叉树、完全二叉树与非完全二叉树</h3>
<ul>
<li><b>满二叉树：</b>每一层都达到最大结点数（深度 k 恰有 2^k - 1 个结点），所有叶子都在最后一层，"胖得匀称"；</li>
<li><b>完全二叉树：</b>把结点按层序从上到下、从左到右编号，与同深度的满二叉树编号一一对应——只在<b>最后一层靠右端</b>允许缺，其余各层全满。满二叉树一定是完全二叉树，反之不成立；</li>
<li><b>非完全二叉树：</b>不符合完全二叉树定义的，例如最后一层从左到右中间缺一个结点或上层不满；</li>
</ul>
<p>完全二叉树的实用结论（必背）：</p>
<ul>
<li>深度为 <b>⌊log₂ n⌋ + 1</b>（n 个结点）；</li>
<li>按层序编号存入数组后，结点 i 的左孩子是 <b>2i</b>、右孩子是 <b>2i+1</b>、父亲是 <b>⌊i/2⌋</b>——这就是<b>堆</b>的存储基础；</li>
<li><b>编号大于 n/2 的结点都是叶子</b>（利用这条可在 O(n) 内建堆）；</li>
<li>最后一层叶子一定靠左连续分布。</li>
</ul>
<h3>五、二叉树的遍历：四大基本功</h3>
<p>遍历按"根"被访问的时机命名，是构造和识别二叉树的基本功：</p>
<pre>void preorder(Node* p)   { if (p) { visit(p); preorder(p-&gt;l); preorder(p-&gt;r); } }  // 先序：根左右
void inorder(Node* p)    { if (p) { inorder(p-&gt;l);  visit(p); inorder(p-&gt;r); } }   // 中序：左根右
void postorder(Node* p)  { if (p) { postorder(p-&gt;l); postorder(p-&gt;r); visit(p); } } // 后序：左右根
// 层序遍历（宽度优先）：根入队；出队访问，再把左右孩子依次入队（队列驱动）</pre>
<ul>
<li>三种深搜遍历（先/中/后序）都属于<b>深度优先</b>过程；层序遍历是<b>宽度优先</b>过程；</li>
<li><b>中序 + 先序</b>（或中序 + 后序）可以唯一确定一棵二叉树：先序/后序定根，中序分左右；但<b>先序 + 后序不能唯一确定</b>（分不清独子是左是右）；</li>
<li>已知遍历序列求另一序列的技巧：先序第一个是根、后序最后一个是根；中序里根的位置把序列劈成左子树 + 根 + 右子树；</li>
<li>先序遍历的第一个访问、中序遍历的根位置、后序遍历的最后一个访问是同一结点。</li>
</ul>
<h3>六、二叉树的存储结构</h3>
<ul>
<li><b>顺序存储：</b>用数组按层序编号存储，适合完全二叉树（不会浪费空间）；非完全二叉树浪费格子（要按"虚结点"位置占位）；</li>
<li><b>链式存储：</b>每个结点含数据 + 左孩子指针 + 右孩子指针（最常用）；每个结点有三个域：data、lchild、rchild；</li>
<li>完全二叉树几乎只用顺序存储（堆），其他二叉树都用链式存储。</li>
</ul>
<h3>七、典型真题精讲</h3>
<p><b>真题 1（2309 单选第 11 题）：</b>"一棵二叉树有 10 个度为 2 的结点、5 个度为 1 的结点，则该树共有多少个叶子结点？"<br>解析：叶子数 n₀ = n₂ + 1 = 10 + 1 = 11。总结点数 n = n₀ + n₁ + n₂ = 11 + 5 + 10 = 26。</p>
<p><b>真题 2（2312 单选）：</b>"深度为 5 的满二叉树的结点总数为？"<br>解析：满二叉树第 k 层最多 2^(k-1) 个，总共 2^k - 1 个。k=5 → 2^5 - 1 = 31。</p>
<p><b>真题 3（2403 单选）：</b>"下列说法正确的是？"<br>A. 完全二叉树一定是满二叉树　B. 满二叉树一定是完全二叉树　C. 二叉树就是度为 2 的树　D. 二叉树左右子树无序<br>解析：答案是 B。满二叉树每一层都满，自然也是完全二叉树；反之不成立——完全二叉树只在最后一层右侧允许缺，不一定满；C 错在二叉树左右有序且允许只有左/右孩子；D 错在左右有序。</p>
<p><b>真题 4（2409 单选）：</b>"已知二叉树的先序遍历为 ABDECF、中序遍历为 BDAECF，则该树的后序遍历为？"<br>解析：先序第一 A 是根；中序中 A 把序列分为左 BDE、右 CF；先序除根后 BDEF，对应左子树 BDEC；递归下去，后序为 DBEFCA。</p>
<h3>八、易错点对比小结</h3>
<ul>
<li>n₀ = n₂ + 1 是万能钥匙，由叶子数反推总点数常用；</li>
<li>完全二叉树"允许最后一层右侧缺"，仅缺一个叶子它仍是完全二叉树；</li>
<li>"既是完全二叉树又是二叉搜索树"要看是否同时满足两个定义，别只验一个；</li>
<li>二叉树左右子树有序，交换左右孩子得到的是不同的树；</li>
<li>先序 + 后序不能唯一确定二叉树（必须含中序）；</li>
<li>三种深序遍历（先/中/后）都是深度优先，层序是宽度优先；</li>
<li>深度 = 根到该结点的边数 + 1（根深度 1），别和"边数"混淆。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) n₀ = n₂ + 1 是万能钥匙；(2) 完全二叉树"允许最后一层右侧缺"，仅缺一个叶子它仍是完全二叉树；(3) "既是完全二叉树又是二叉搜索树"要看是否同时满足两个定义，别只验一个；(4) 二叉树左右子树有序，交换左右孩子得到的是不同的树；(5) 先序 + 后序不能唯一确定二叉树，必须有中序参与；(6) 已知先序、中序推后序，先用先序定根，再用中序分左右，最后递归组合。</div>
`,

"二叉排序树与二叉树搜索": `
<h3>一、什么是二叉排序树</h3>
<p><b>二叉排序树（Binary Search Tree，BST，又称二叉搜索树、二叉查找树）</b>要么为空，要么满足：<b>左子树所有结点 &lt; 根 &lt; 右子树所有结点，且左右子树各自也是二叉排序树</b>。它像一本按字母排序的词典：往左找小的、往右找大的。真题判断"二叉搜索树的左右子树也是二叉搜索树"为正确。判断"二叉搜索树中左子树所有结点值都小于根、右子树所有结点值都大于根"也是正确——但别忘了"等号"约定（处理重复值的不同实现）。</p>
<h3>二、二叉树的搜索算法详解</h3>
<p>在 BST 中查找值 key，从根出发一路比较：相等即找到；key 小就走左子树、大就走右子树，走到空即不存在。</p>
<pre>Node* find(Node* p, int key) {
    while (p != NULL &amp;&amp; p-&gt;data != key) {
        if (key &lt; p-&gt;data) p = p-&gt;left;     // 小了往左
        else                 p = p-&gt;right;   // 大了往右
    }
    return p;                                // NULL 表示不存在
}</pre>
<ul>
<li>查找、插入的代价取决于<b>树的深度</b>：平衡时每层排除一半，n 个结点平均查找时间复杂度为 <b>O(log n)</b>；</li>
<li>若插入序列有序（如 1 2 3 4 5），BST 退化成一条链（因为每次都比前一个大、都挂到右孩子），查找退化为 <b>O(n)</b>。真题考过"n 个结点的二叉搜索树平均查找复杂度"，标准答案 O(log n)；</li>
<li>对 BST 做<b>中序遍历恰好得到递增（升序）序列</b>，这是它"排序"名字的由来，也是真题最爱考的结论。同一组关键字按不同顺序插入，得到的 BST 形态不同，但中序序列相同。</li>
</ul>
<h3>三、插入与删除</h3>
<ul>
<li><b>插入：</b>按查找的路线走，走到空位时把新结点挂上。若已有相同值，视约定（通常不再插入或改成计数）。</li>
<li><b>删除（三种情况）：</b>删除叶子直接摘除；只有一个孩子则让孩子顶替；有两个孩子则用<b>中序前驱（左子树最大）或中序后继（右子树最小）</b>顶替再删替身。两种方式都保持 BST 性质；</li>
<li>删除有两个孩子的结点时要小心：直接删除会导致两棵子树断开，所以必须找到"前驱/后继"顶替。真题考过删除算法的细节。</li>
</ul>
<h3>四、平衡二叉树（AVL）概念</h3>
<p>BST 退化问题催生了<b>平衡二叉树</b>：任意结点左右子树高度差的绝对值不超过 1（左右子树也要平衡），且本身通常要求是 BST。平衡时查找稳定为 O(log n)。判断题"某树既是二叉搜索树又是平衡二叉树"需要两个条件都验，只满足其一就是错误选项。</p>
<h3>五、典型真题精讲</h3>
<p><b>真题 1（2312 单选）：</b>"对二叉排序树进行中序遍历，得到的序列是？"<br>A. 升序　B. 降序　C. 无序　D. 不确定<br>解析：答案是 A。BST 的中序遍历恰好得到关键字的升序序列，这是 BST 的标志性性质。</p>
<p><b>真题 2（2409 判断）：</b>"n 个结点的二叉搜索树的平均查找时间复杂度为 O(n)。"<br>解析：错误。平衡 BST 平均查找 O(log n)；只有退化成链时才是 O(n)。题中说"二叉搜索树"默认指平均情况（结构较好的情形），答案是 O(log n)。</p>
<p><b>真题 3（2403 单选）：</b>"依次插入 5、3、8、1、4、7、9 到空 BST 中，查找 8 需要比较几次？"<br>解析：插入后 BST 形态：5 为根，左 3（3 左 1、右 4），右 8（8 左 7、右 9）。查找 8：5 → 8（两次比较）。答案：2 次。</p>
<p><b>真题 4（2603 单选）：</b>"下列说法正确的是？"<br>A. 二叉搜索树左右子树仍为二叉搜索树　B. 二叉搜索树的中序遍历序列降序　C. 二叉搜索树深度一定是 O(log n)　D. 二叉搜索树只能用于查找<br>解析：答案是 A。B 是升序不是降序；C 平均 O(log n)，最坏 O(n)；D 还可以做插入、删除、范围查询、排序（先中序遍历就是排序）。</p>
<h3>六、易错点对比小结</h3>
<ul>
<li>BST 中序遍历得升序序列；</li>
<li>平均查找 O(log n)、最坏（退化链）O(n)；</li>
<li>BST 左右子树仍是 BST；</li>
<li>平衡二叉树要求左右子树高度差至多 1 且本身通常还要求是 BST；</li>
<li>同一组关键字按不同顺序插入，得到的 BST 形态不同，但中序序列相同；</li>
<li>"二叉搜索树中左子树所有结点都小于根"——若允许相等则需明确写"严格小于"或"小于等于"。</li>
</ul>
<div class="tip"><b>考试高频陷阱：</b>(1) BST 中序遍历得升序序列；(2) 平均查找 O(log n)、最坏（退化链）O(n)；(3) BST 左右子树仍是 BST；(4) 平衡二叉树要求左右子树高度差至多 1 且本身通常还要求是 BST；(5) 同一组关键字按不同顺序插入，得到的 BST 形态不同，但中序序列相同；(6) 删除有两个孩子的结点要用前驱/后继顶替，别直接摘掉。</div>
